<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obra — Vivienda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e67e22; --primary-dark: #d35400;
            --bg: #f0f2f5; --card: #fff;
            --text: #2c3e50; --text-light: #7f8c8d;
            --border: #e0e0e0; --success: #27ae60; --danger: #e74c3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ─── Modal ─── */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.open { display:flex; }
        .modal { background:white; border-radius:16px; padding:28px; width:100%; max-width:540px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto; }
        .modal-title { font-size:20px; font-weight:800; margin-bottom:6px; }
        .modal-sub   { font-size:13px; color:var(--text-light); margin-bottom:22px; }
        .type-grid   { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:22px; }
        .type-btn    { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border:2px solid var(--border); border-radius:10px; cursor:pointer; background:white; transition:all .15s; font-family:inherit; }
        .type-btn:hover    { border-color:var(--primary); background:#fff8f0; }
        .type-btn.selected { border-color:var(--primary); background:#fff3e0; }
        .type-btn .t-icon  { font-size:22px; }
        .type-btn .t-name  { font-size:10px; font-weight:600; text-align:center; }
        .modal-field  { margin-bottom:18px; }
        .modal-label  { font-size:12px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block; }
        .modal-input  { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; transition:border-color .15s; }
        .modal-input:focus { outline:none; border-color:var(--primary); }
        .modal-actions { display:flex; gap:10px; justify-content:flex-end; }

        /* ─── Buttons ─── */
        .btn               { padding:10px 20px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; border:none; font-family:inherit; transition:all .15s; }
        .btn-primary       { background:var(--primary); color:white; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-primary:disabled { background:#ddd; color:#aaa; cursor:not-allowed; }
        .btn-ghost         { background:#f0f0f0; color:var(--text); }
        .btn-ghost:hover   { background:#e5e5e5; }
        .btn-danger        { background:#fdecea; color:var(--danger); }
        .btn-danger:hover  { background:#f5c6c2; }

        /* ─── Header ─── */
        .header { background:#2c3e50; color:white; padding:0 24px; display:flex; align-items:center; gap:14px; height:52px; box-shadow:0 2px 8px rgba(0,0,0,.25); position:sticky; top:0; z-index:100; }
        .header h1   { font-size:17px; font-weight:700; white-space:nowrap; }
        .header-tabs { display:flex; gap:3px; margin-left:14px; }
        .header-tab  { padding:6px 14px; border-radius:6px; font-size:13px; font-weight:600; border:none; cursor:pointer; font-family:inherit; transition:all .15s; color:rgba(255,255,255,.65); background:rgba(255,255,255,.1); }
        .header-tab:hover  { background:rgba(255,255,255,.18); color:white; }
        .header-tab.active { background:var(--primary); color:white; }
        .header-progress   { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:rgba(255,255,255,.6); flex-shrink:0; }
        .hpbar      { width:120px; height:6px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; }
        .hpbar-fill { height:100%; background:var(--primary); border-radius:4px; transition:width .4s; }
        .hpct       { font-size:13px; font-weight:700; color:white; min-width:34px; text-align:right; }

        /* ─── Layout ─── */
        .main { display:flex; height:calc(100vh - 52px); }

        /* ─── Sidebar ─── */
        .sidebar { width:210px; background:white; border-right:1px solid var(--border); flex-shrink:0; display:flex; flex-direction:column; overflow-y:auto; }
        .sidebar-global   { padding:14px 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .sidebar-label    { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); margin-bottom:8px; }
        .sb-pbar-wrap     { display:flex; align-items:center; gap:8px; }
        .sb-pbar          { flex:1; height:5px; background:#e0e0e0; border-radius:3px; overflow:hidden; }
        .sb-pbar-fill     { height:100%; background:var(--primary); border-radius:3px; }
        .sb-pct           { font-size:12px; font-weight:700; color:var(--primary); }
        .sidebar-add-btn  { display:flex; align-items:center; gap:8px; margin:10px 12px 4px; padding:9px 12px; background:#fff3e0; border:1.5px dashed var(--primary); border-radius:9px; cursor:pointer; color:var(--primary-dark); font-size:13px; font-weight:600; font-family:inherit; transition:all .15s; }
        .sidebar-add-btn:hover { background:#ffe0b2; }
        .sidebar-section-title { padding:10px 16px 4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); }
        .nav-item  { display:flex; align-items:center; gap:10px; padding:9px 16px; cursor:pointer; border-left:3px solid transparent; transition:all .15s; flex-shrink:0; }
        .nav-item:hover  { background:#f8f9fa; }
        .nav-item.active { background:#fff3e0; border-left-color:var(--primary); }
        .nav-item.active .nav-name { color:var(--primary-dark); font-weight:600; }
        .nav-icon  { font-size:17px; width:22px; text-align:center; flex-shrink:0; }
        .nav-info  { flex:1; min-width:0; }
        .nav-name  { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .nav-sub   { font-size:10px; color:var(--text-light); margin-top:1px; }
        .nav-mini-bar  { height:3px; background:#e0e0e0; border-radius:2px; margin-top:3px; overflow:hidden; }
        .nav-mini-fill { height:100%; background:var(--primary); border-radius:2px; }
        .nav-trade-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg,#f5efe6 0%,#eef2f7 100%); }
        .login-card { width:100%; max-width:430px; background:white; border-radius:22px; padding:30px; box-shadow:0 18px 50px rgba(0,0,0,.12); }
        .login-brand { font-size:28px; font-weight:800; color:var(--text); margin-bottom:8px; }
        .login-sub { font-size:14px; color:var(--text-light); line-height:1.6; margin-bottom:22px; }
        .login-error { background:#fdecea; color:var(--danger); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
        .login-actions { display:flex; gap:10px; align-items:center; margin-top:8px; }
        .login-foot { margin-top:18px; font-size:12px; color:var(--text-light); line-height:1.6; }
        .admin-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start; }
        .admin-card { background:white; border-radius:14px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .admin-user-list { display:flex; flex-direction:column; gap:10px; }
        .admin-user-item { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid #f0f0f0; }
        .admin-user-item:first-child { border-top:none; padding-top:0; }
        .admin-user-name { font-size:14px; font-weight:700; }
        .admin-user-meta { font-size:12px; color:var(--text-light); margin-top:3px; }
        .admin-inline-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .admin-mini-note { font-size:12px; color:var(--text-light); line-height:1.5; margin-top:8px; }

        /* ─── Content ─── */
        .content { flex:1; padding:24px; overflow-y:auto; }

        /* ─── Page headers ─── */
        .dash-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
        .page-title  { font-size:22px; font-weight:800; margin-bottom:4px; }
        .page-sub    { font-size:14px; color:var(--text-light); }
        .add-room-btn { display:flex; align-items:center; gap:8px; padding:10px 18px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; flex-shrink:0; }
        .add-room-btn:hover { background:var(--primary-dark); }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
        .empty-state .empty-icon { font-size:56px; margin-bottom:16px; }
        .empty-state h2 { font-size:20px; font-weight:700; color:var(--text); margin-bottom:8px; }
        .empty-state p  { font-size:14px; margin-bottom:24px; }

        /* ─── Cards ─── */
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
        .room-card  { background:white; border-radius:14px; padding:20px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.07); transition:all .2s; }
        .room-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
        .room-card-top  { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
        .room-card-icon { font-size:28px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:#fff3e0; border-radius:12px; flex-shrink:0; }
        .room-card-name { font-size:16px; font-weight:700; margin-bottom:2px; }
        .room-card-type { font-size:11px; color:var(--text-light); margin-bottom:2px; }
        .room-card-meta { font-size:12px; color:var(--text-light); }
        .card-pbar-row  { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
        .card-pbar-lbl  { font-size:12px; color:var(--text-light); flex:1; }
        .card-pct       { font-size:12px; font-weight:700; }
        .card-pbar      { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin-bottom:12px; }
        .card-pbar-fill { height:100%; border-radius:3px; transition:width .3s; }
        .trade-dots     { display:flex; flex-wrap:wrap; gap:5px; }
        .trade-dot      { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:.3; }
        .trade-dot.done    { opacity:1; }
        .trade-dot.partial { opacity:.65; }

        /* ─── Trade card (oficios grid) ─── */
        .trade-card { background:white; border-radius:14px; padding:20px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.07); transition:all .2s; }
        .trade-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
        .trade-card-top  { display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
        .trade-card-icon { font-size:28px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0; }
        .trade-card-name { font-size:16px; font-weight:700; margin-bottom:4px; }
        .trade-card-info { font-size:12px; color:var(--text-light); line-height:1.7; }
        .trade-card-budget { font-size:15px; font-weight:700; margin-top:4px; }

        /* ─── Summary cards (materiales) ─── */
        .summary-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
        .summary-card  { background:white; border-radius:14px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .summary-card.s-total   { border-left:4px solid #2c3e50; }
        .summary-card.s-done    { border-left:4px solid var(--success); }
        .summary-card.s-pending { border-left:4px solid var(--primary); }
        .sc-label { font-size:11px; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; font-weight:700; }
        .sc-value { font-size:24px; font-weight:800; margin-bottom:4px; }
        .sc-pct   { font-size:13px; color:var(--text-light); }
        .sc-tasks { font-size:12px; color:var(--text-light); margin-top:2px; }
        .mat-warning { background:#fff8e1; border:1px solid #ffe082; border-radius:10px; padding:12px 16px; font-size:13px; color:#7d5a00; margin-bottom:16px; }

        /* ─── Materials table ─── */
        .mat-hdr, .mat-row-item {
            display:grid;
            grid-template-columns: 130px 1fr 56px 44px 90px 90px 28px;
            gap:8px; align-items:center; padding:8px 18px;
        }
        .mat-hdr { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-light); border-bottom:1px solid #eee; background:#fafafa; }
        .mat-row-item { font-size:13px; border-bottom:1px solid #f8f8f8; }
        .mat-row-item:last-child { border-bottom:none; }
        .mat-row-item:hover { background:#fafafa; }
        .mat-col-room  { font-size:11px; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mat-col-task  { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .mat-col-task.is-done { color:var(--text-light); text-decoration:line-through; }
        .mat-col-num   { text-align:right; color:var(--text-light); }
        .mat-col-total { text-align:right; font-weight:600; }
        .cost-done     { color:var(--success); }
        .cost-pending  { color:var(--primary); }
        .mat-col-status{ text-align:center; }
        .mat-no-cost   { color:#ccc; }

        /* ─── Detail: room / trade ─── */
        .back-btn { display:inline-flex; align-items:center; gap:6px; color:var(--text-light); cursor:pointer; font-size:13px; margin-bottom:18px; border:none; background:none; padding:0; font-family:inherit; }
        .back-btn:hover { color:var(--text); }
        .detail-header { background:white; border-radius:14px; padding:24px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .detail-title-row { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
        .detail-big-icon  { font-size:38px; flex-shrink:0; }
        .detail-name-wrap { flex:1; min-width:0; }
        .detail-name-input { font-size:22px; font-weight:800; color:var(--text); border:none; background:transparent; font-family:inherit; width:100%; padding:2px 4px; border-radius:6px; border-bottom:2px solid transparent; transition:border-color .15s; }
        .detail-name-input:hover { border-bottom-color:var(--border); }
        .detail-name-input:focus { outline:none; border-bottom-color:var(--primary); }
        .detail-room-type  { font-size:12px; color:var(--text-light); padding:0 4px; margin-top:2px; }
        .detail-room-sub   { font-size:13px; color:var(--text-light); padding:0 4px; margin-top:1px; }
        .detail-pct-badge  { font-size:30px; font-weight:900; margin-left:auto; flex-shrink:0; }
        .detail-pbar       { height:8px; background:#e0e0e0; border-radius:4px; overflow:hidden; margin-bottom:22px; }
        .detail-pbar-fill  { height:100%; border-radius:4px; transition:width .4s; }
        .detail-actions    { display:flex; justify-content:flex-end; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
        .section-label     { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text-light); margin-bottom:10px; }

        /* Measures + materials */
        .measure-row  { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
        .measure-group{ display:flex; flex-direction:column; gap:4px; }
        .measure-lbl  { font-size:12px; color:var(--text-light); font-weight:500; }
        .measure-inp  { padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; width:140px; transition:border-color .15s; }
        .measure-inp:focus { outline:none; border-color:var(--primary); }
        .materials-box   { background:#fff8f0; border:1px solid #ffe0b2; border-radius:10px; padding:16px; }
        .materials-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--primary-dark); margin-bottom:12px; }
        .materials-grid  { display:flex; flex-wrap:wrap; gap:14px 24px; }
        .mat-item  { min-width:130px; }
        .mat-lbl   { font-size:11px; color:var(--text-light); }
        .mat-val   { font-size:16px; font-weight:700; }
        .mat-empty { font-size:13px; color:#bbb; font-style:italic; }

        /* Trade info (oficios) */
        .trade-info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:6px; }
        .info-field  { display:flex; flex-direction:column; gap:5px; }
        .info-label  { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-light); }
        .info-input  { padding:9px 13px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; transition:border-color .15s; }
        .info-input:focus { outline:none; border-color:var(--primary); }

        /* ─── Trade accordion ─── */
        .trade-section  { background:white; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
        .trade-hdr      { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; }
        .trade-hdr:hover{ background:#fafafa; }
        .trade-accent   { width:5px; height:30px; border-radius:3px; flex-shrink:0; }
        .trade-icon     { font-size:17px; }
        .trade-name     { font-size:14px; font-weight:600; flex:1; }
        .trade-count    { font-size:12px; color:var(--text-light); }
        .trade-chevron  { font-size:11px; color:var(--text-light); }
        .trade-pbar     { height:3px; }
        .trade-pbar-fill{ height:100%; transition:width .3s; }
        .trade-tasks           { padding:6px 18px 6px; }
        .trade-tasks.collapsed { display:none; }

        /* ─── Task rows ─── */
        .task-container { border-bottom:1px solid #f5f5f5; }
        .task-container:last-of-type { border-bottom:none; }
        .task-container.drag-over    { box-shadow:0 -2px 0 var(--primary); }
        .task-row  { display:flex; align-items:center; gap:10px; padding:9px 2px; cursor:pointer; border-radius:4px; }
        .task-row:hover { background:#fafafa; }
        .task-row.dragging { opacity:.35; }
        .drag-handle { color:#ccc; font-size:14px; cursor:grab; padding:0 2px; flex-shrink:0; user-select:none; letter-spacing:-2px; }
        .drag-handle:active { cursor:grabbing; }
        .drag-handle:hover  { color:#999; }
        .task-check { width:21px; height:21px; border:2px solid #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; font-size:12px; color:transparent; }
        .task-check.checked { border-color:var(--success); background:var(--success); color:white; }
        .task-text  { font-size:14px; flex:1; }
        .task-text.done { text-decoration:line-through; color:#bbb; }

        /* Task cost badge */
        .task-badge { font-size:11px; color:var(--text-light); background:#f5f5f5; border-radius:10px; padding:2px 8px; white-space:nowrap; flex-shrink:0; display:none; }
        .task-badge.visible { display:inline-block; }

        /* Task action buttons */
        .task-detail-btn { opacity:0; padding:3px 6px; background:none; border:none; font-size:13px; cursor:pointer; border-radius:4px; flex-shrink:0; transition:all .15s; color:var(--text-light); }
        .task-row:hover .task-detail-btn { opacity:1; }
        .task-detail-btn.has-data { opacity:1; color:var(--primary); }
        .task-detail-btn:hover { background:#f0f0f0; }
        .task-del-btn  { opacity:0; padding:3px 7px; background:none; border:none; color:#ccc; font-size:15px; cursor:pointer; border-radius:4px; transition:all .15s; flex-shrink:0; }
        .task-row:hover .task-del-btn { opacity:1; }
        .task-del-btn:hover { background:#fdecea; color:var(--danger); }

        /* Task detail panel (costs + notes) */
        .task-detail      { padding:8px 6px 12px 44px; background:#fafafa; border-top:1px solid #f0f0f0; }
        .detail-cost-row  { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
        .cost-field       { display:flex; flex-direction:column; gap:4px; }
        .cost-sep         { font-size:16px; color:var(--text-light); padding-bottom:8px; font-weight:300; }
        .cost-label       { font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.3px; }
        .cost-input       { width:86px; padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; transition:border-color .15s; }
        .cost-input:focus { outline:none; border-color:var(--primary); }
        .cost-select      { padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:white; cursor:pointer; }
        .cost-select:focus{ outline:none; border-color:var(--primary); }
        .cost-total-box   { display:flex; flex-direction:column; gap:4px; }
        .cost-total       { font-size:16px; font-weight:800; color:var(--text); padding:7px 0; }
        .task-notes-inp   { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; min-height:56px; color:var(--text); transition:border-color .15s; }
        .task-notes-inp:focus { outline:none; border-color:var(--primary); }
        .task-notes-preview { font-size:12px; color:var(--text-light); padding:0 6px 6px 44px; font-style:italic; white-space:pre-wrap; }
        .task-desc-preview  { font-size:12px; color:var(--text-light); padding:2px 6px 4px 46px; line-height:1.5; }

        /* Add-task row */
        .task-add-row { display:flex; align-items:center; gap:8px; padding:10px 2px 6px; border-top:1px dashed #e8e8e8; margin-top:4px; }
        .task-add-inp { flex:1; padding:7px 10px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:13px; font-family:inherit; transition:border-color .15s; }
        .task-add-inp:focus { outline:none; border-color:var(--primary); }
        .task-add-btn { padding:7px 13px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; flex-shrink:0; }
        .task-add-btn:hover { background:var(--primary-dark); }

        /* Room group (trade detail) */
        .room-group     { background:white; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
        .room-group-hdr { display:flex; align-items:center; gap:12px; padding:13px 18px; cursor:pointer; user-select:none; }
        .room-group-hdr:hover { background:#fafafa; }
        .room-group-name  { font-size:14px; font-weight:600; flex:1; }
        .room-group-count { font-size:12px; color:var(--text-light); }
        .room-group-tasks           { padding:6px 18px 6px; }
        .room-group-tasks.collapsed { display:none; }

        ::-webkit-scrollbar       { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }

        /* ─── Projects selector ─── */
        .projects-page { min-height:100vh; background:var(--bg); display:flex; flex-direction:column; }
        .projects-topbar { background:#2c3e50; color:white; padding:0 32px; height:58px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 8px rgba(0,0,0,.25); }
        .projects-topbar h1 { font-size:18px; font-weight:800; flex:1; }
        .projects-body { flex:1; max-width:1100px; margin:0 auto; padding:40px 24px; width:100%; }
        .projects-title { font-size:26px; font-weight:800; margin-bottom:6px; }
        .projects-sub   { font-size:14px; color:var(--text-light); margin-bottom:28px; }
        .project-card { background:white; border-radius:16px; padding:24px; cursor:pointer; border:2px solid transparent; box-shadow:0 2px 8px rgba(0,0,0,.07); transition:all .2s; position:relative; overflow:hidden; }
        .project-card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:var(--proj-color, #e67e22); }
        .project-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.1); }
        .project-card-name { font-size:18px; font-weight:800; margin:10px 0 4px; }
        .project-card-meta { font-size:12px; color:var(--text-light); line-height:1.7; margin-bottom:14px; }
        .project-card-stats { display:flex; gap:20px; }
        .proj-stat-val { font-size:20px; font-weight:800; }
        .proj-stat-lbl { font-size:11px; color:var(--text-light); }
        .project-edit-btn { position:absolute; top:14px; right:14px; background:rgba(0,0,0,.06); border:none; border-radius:6px; padding:4px 8px; font-size:14px; cursor:pointer; opacity:0; transition:opacity .15s; }
        .project-card:hover .project-edit-btn { opacity:1; }
        .project-add-card { background:white; border-radius:16px; padding:24px; border:2px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:all .2s; min-height:180px; font-family:inherit; }
        .project-add-card:hover { border-color:var(--primary); background:#fff8f0; }
        .project-add-card .pa-icon { font-size:32px; color:var(--text-light); }
        .project-add-card span { font-size:14px; font-weight:600; color:var(--text-light); }
        /* In-project header additions */
        .proj-back-btn { padding:5px 11px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-size:12px; font-weight:600; background:rgba(255,255,255,.13); color:rgba(255,255,255,.8); transition:all .15s; flex-shrink:0; }
        .proj-back-btn:hover { background:rgba(255,255,255,.22); color:white; }
        .proj-name-badge { font-size:13px; font-weight:700; color:rgba(255,255,255,.9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; flex-shrink:0; }
        /* Color picker */
        .color-dot { width:26px; height:26px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:transform .15s; flex-shrink:0; outline:none; }
        .color-dot.selected { border-color:white; box-shadow:0 0 0 2px #555; transform:scale(1.2); }

        /* ─── Documents ─── */
        .doc-cat-section { background:white; border-radius:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
        .doc-cat-hdr { display:flex; align-items:center; gap:12px; padding:16px 20px; cursor:pointer; user-select:none; }
        .doc-cat-hdr:hover { background:#fafafa; }
        .doc-cat-icon { font-size:22px; flex-shrink:0; }
        .doc-cat-info { flex:1; }
        .doc-cat-name { font-size:15px; font-weight:700; }
        .doc-cat-desc { font-size:11px; color:var(--text-light); margin-top:1px; }
        .doc-cat-count { font-size:12px; color:var(--text-light); flex-shrink:0; }
        .doc-list { padding:8px 20px 16px; border-top:1px solid #f5f5f5; }
        .doc-dropzone { margin-top:10px; border:2px dashed #e6c7ab; border-radius:12px; padding:16px; text-align:center; font-size:13px; color:var(--text-light); background:#fffaf5; transition:all .15s; }
        .doc-dropzone.drag-over { border-color:var(--primary); background:#fff3e0; color:var(--primary-dark); }
        .doc-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f8f8f8; }
        .doc-item:last-child { border-bottom:none; }
        .doc-type-icon { font-size:20px; flex-shrink:0; }
        .doc-name-inp { flex:1; border:none; font-size:14px; font-family:inherit; background:transparent; padding:3px 6px; border-radius:6px; border-bottom:1.5px solid transparent; min-width:0; transition:border-color .15s; }
        .doc-name-inp:hover { border-bottom-color:var(--border); }
        .doc-name-inp:focus { outline:none; border-bottom-color:var(--primary); }
        .doc-notes-inp { width:160px; border:none; font-size:12px; color:var(--text-light); font-family:inherit; font-style:italic; background:transparent; padding:3px 6px; flex-shrink:0; }
        .doc-notes-inp:focus { outline:none; font-style:normal; }
        .doc-date { font-size:11px; color:var(--text-light); flex-shrink:0; white-space:nowrap; }
        .doc-btn { padding:5px 11px; border-radius:7px; border:1.5px solid var(--border); font-size:12px; font-weight:600; cursor:pointer; background:white; font-family:inherit; transition:all .15s; white-space:nowrap; flex-shrink:0; }
        .doc-btn-view { border-color:#1976D2; color:#1976D2; }
        .doc-btn-view:hover { background:#e3f2fd; }
        .doc-btn-del { color:#ccc; }
        .doc-btn-del:hover { background:#fdecea; border-color:var(--danger); color:var(--danger); }
        .doc-add-row { display:flex; justify-content:flex-end; padding-top:10px; border-top:1px dashed #eee; margin-top:6px; }
        .doc-empty { font-size:13px; color:var(--text-light); font-style:italic; padding:6px 0 10px; }

        /* ─── Companies ─── */
        .company-card { background:white; border-radius:14px; padding:20px; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.07); transition:all .2s; cursor:pointer; }
        .company-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
        .company-card-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
        .company-avatar { width:48px; height:48px; border-radius:12px; background:#e3f2fd; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
        .company-name { font-size:16px; font-weight:700; margin-bottom:3px; }
        .company-meta { font-size:12px; color:var(--text-light); line-height:1.8; }
        .trade-tag { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin:2px 2px 0 0; }

        /* ─── Notes ─── */
        .note-add-box { background:white; border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .note-controls { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .note-cat-sel { padding:8px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; background:white; cursor:pointer; }
        .note-cat-sel:focus { outline:none; border-color:var(--primary); }
        .note-add-row { display:flex; gap:10px; align-items:flex-end; }
        .note-textarea { flex:1; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; resize:vertical; min-height:72px; transition:border-color .15s; }
        .note-textarea:focus { outline:none; border-color:var(--primary); }
        .note-entry { background:white; border-radius:12px; padding:16px 20px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); display:flex; gap:14px; align-items:flex-start; }
        .note-cat-badge { padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; flex-shrink:0; white-space:nowrap; margin-top:2px; }
        .note-cat-df      { background:#e3f2fd; color:#1565c0; }
        .note-cat-gestora { background:#f3e5f5; color:#6a1b9a; }
        .note-cat-general { background:#eceff1; color:#37474f; }
        .note-body { flex:1; }
        .note-date { font-size:11px; color:var(--text-light); margin-bottom:5px; }
        .note-text { font-size:14px; line-height:1.6; white-space:pre-wrap; }
        .note-del-btn { background:none; border:none; color:#ccc; cursor:pointer; font-size:15px; padding:2px 6px; border-radius:4px; flex-shrink:0; transition:all .15s; }
        .note-del-btn:hover { background:#fdecea; color:var(--danger); }

        /* ─── Photos ─── */
        .photo-section-tabs { display:flex; gap:6px; margin-bottom:20px; }
        .photo-tab  { padding:8px 18px; border-radius:8px; border:1.5px solid var(--border); font-size:13px; font-weight:600; cursor:pointer; background:white; font-family:inherit; transition:all .15s; }
        .photo-tab.active  { background:var(--primary); color:white; border-color:var(--primary); }
        .photo-tab:hover:not(.active) { border-color:var(--primary); }
        .photo-room-selector { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
        .photo-room-btn { padding:7px 14px; border-radius:8px; border:1.5px solid var(--border); font-size:13px; cursor:pointer; background:white; font-family:inherit; transition:all .15s; }
        .photo-room-btn.active { border-color:var(--primary); background:#fff3e0; color:var(--primary-dark); font-weight:600; }
        .photo-room-btn:hover:not(.active) { border-color:var(--primary); }
        .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
        .photo-card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.07); position:relative; }
        .photo-card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; cursor:pointer; }
        .photo-card-body { padding:10px 12px; }
        .photo-caption-inp { width:100%; border:none; font-size:12px; color:var(--text-light); font-family:inherit; background:transparent; padding:0; }
        .photo-caption-inp:focus { outline:none; color:var(--text); }
        .photo-del-btn { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); color:white; border:none; border-radius:6px; cursor:pointer; padding:3px 7px; font-size:12px; opacity:0; transition:opacity .15s; }
        .photo-card:hover .photo-del-btn { opacity:1; }
        .photo-add-btn { border:2px dashed var(--border); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; aspect-ratio:4/3; font-size:13px; color:var(--text-light); transition:all .15s; background:white; font-family:inherit; }
        .photo-add-btn:hover { border-color:var(--primary); color:var(--primary); background:#fff8f0; }
        .photo-add-btn .pa-icon { font-size:28px; }
        /* Cert section inside task detail */
        .cert-section { margin-top:10px; padding-top:10px; border-top:1px solid #f0f0f0; }
        .cert-status-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:700; }
        .cert-pending  { background:#fff8e1; color:#e65100; }
        .cert-approved { background:#e8f5e9; color:#2e7d32; }
        .cert-revision { background:#fdecea; color:#c62828; }
        .cert-photo-wrap { margin:10px 0; border-radius:10px; overflow:hidden; max-width:320px; position:relative; }
        .cert-photo-wrap img { width:100%; display:block; border-radius:10px; cursor:pointer; }
        .cert-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
        .cert-btn { padding:6px 14px; border-radius:8px; font-size:12px; font-weight:600; border:1.5px solid transparent; cursor:pointer; font-family:inherit; transition:all .15s; }
        .cert-btn-photo    { background:#f0f0f0; color:var(--text); border-color:#e0e0e0; }
        .cert-btn-approve  { background:#e8f5e9; color:#2e7d32; border-color:#a5d6a7; }
        .cert-btn-revision { background:#fdecea; color:#c62828; border-color:#ef9a9a; }
        .cert-btn:hover { filter:brightness(.95); }
        .cert-comment-inp { width:100%; margin-top:8px; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; }
        .cert-comment-inp:focus { outline:none; border-color:var(--primary); }
        .cert-comment-display { font-size:12px; background:#fff8e1; border-radius:8px; padding:8px 10px; margin-top:8px; color:#5d4037; }
        /* Cert badge in task row */
        .cert-row-badge { font-size:13px; flex-shrink:0; }
        .task-date-preview { font-size:11px; color:var(--primary-dark); margin-top:3px; }
        .calendar-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
        .calendar-nav { display:flex; align-items:center; gap:8px; }
        .calendar-month { font-size:18px; font-weight:800; min-width:170px; text-align:center; }
        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:20px; }
        .calendar-weekday { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-light); text-align:center; padding:4px 0; }
        .calendar-day { background:white; border:1px solid var(--border); border-radius:12px; min-height:120px; padding:10px; display:flex; flex-direction:column; gap:8px; }
        .calendar-day.muted { opacity:.38; background:#fafafa; }
        .calendar-day.today { border-color:var(--primary); box-shadow:0 0 0 2px #fff3e0 inset; }
        .calendar-day-num { font-size:13px; font-weight:700; }
        .calendar-pill-list { display:flex; flex-direction:column; gap:6px; }
        .calendar-pill { border-radius:8px; padding:5px 7px; font-size:11px; line-height:1.35; color:white; }
        .calendar-pill.milestone { background:#2c3e50; }
        .calendar-pill.task { background:#e67e22; }
        .calendar-pill.done { background:#27ae60; }
        .calendar-empty { font-size:11px; color:#bbb; }
        .calendar-split { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; align-items:start; }
        .milestone-box, .agenda-box { background:white; border-radius:14px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .milestone-form { display:grid; grid-template-columns:1.4fr 1fr 110px; gap:10px; margin:14px 0 18px; }
        .milestone-list { display:flex; flex-direction:column; gap:10px; }
        .milestone-item, .agenda-item { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-top:1px solid #f1f1f1; }
        .milestone-item:first-child, .agenda-item:first-child { border-top:none; padding-top:0; }
        .milestone-date, .agenda-date { min-width:74px; font-size:12px; font-weight:700; color:var(--primary-dark); }
        .milestone-text, .agenda-text { flex:1; font-size:13px; }
        .milestone-sub, .agenda-sub { font-size:11px; color:var(--text-light); margin-top:3px; }
        .mini-del-btn { border:none; background:none; color:#bbb; cursor:pointer; font-size:14px; padding:2px 4px; }
        .mini-del-btn:hover { color:var(--danger); }
        .location-card { background:white; border-radius:14px; padding:22px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .location-main { font-size:22px; font-weight:800; line-height:1.35; margin-bottom:8px; }
        .location-sub { font-size:13px; color:var(--text-light); margin-bottom:18px; }
        .location-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .location-box { background:#fafafa; border:1px solid #eee; border-radius:12px; padding:16px; }
        .location-box-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-light); margin-bottom:8px; }
        .location-box-text { font-size:14px; line-height:1.6; white-space:pre-wrap; }
        @media (max-width: 1100px) {
            .header { height:auto; min-height:52px; padding:10px 16px; flex-wrap:wrap; align-items:center; }
            .header-tabs { order:3; width:100%; margin-left:0; overflow-x:auto; padding-bottom:2px; }
            .header-tabs::-webkit-scrollbar { height:4px; }
            .header-tab { white-space:nowrap; }
            .header-progress { margin-left:auto; }
            .main { flex-direction:column; height:auto; min-height:calc(100vh - 52px); }
            .sidebar { width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:none; }
            .content { padding:20px 16px; }
            .projects-topbar { padding:12px 18px; height:auto; flex-wrap:wrap; }
            .projects-body { padding:28px 16px; }
            .project-card-stats { gap:14px; flex-wrap:wrap; }
            .calendar-split { grid-template-columns:1fr; }
            .milestone-form { grid-template-columns:1fr; }
            .location-grid { grid-template-columns:1fr; }
        }
        @media (max-width: 820px) {
            .modal { padding:22px 18px; border-radius:14px; }
            .type-grid { grid-template-columns:repeat(2,1fr); }
            .admin-grid,
            .admin-inline-grid { grid-template-columns:1fr; }
            .card-grid,
            .summary-cards,
            .photo-grid { grid-template-columns:1fr; }
            .detail-header,
            .note-add-box,
            .summary-card,
            .milestone-box,
            .agenda-box,
            .location-card { padding:18px; }
            .detail-title-row { flex-wrap:wrap; align-items:flex-start; }
            .detail-pct-badge { margin-left:0; }
            .detail-actions { justify-content:stretch; }
            .detail-actions .btn,
            .detail-actions .add-room-btn { width:100%; justify-content:center; }
            .trade-info-grid { grid-template-columns:1fr; }
            .note-controls,
            .note-add-row,
            .photo-section-tabs { flex-direction:column; align-items:stretch; }
            .photo-tab { width:100%; text-align:center; }
            .company-card-top,
            .room-card-top,
            .trade-card-top { align-items:flex-start; }
            .calendar-grid { gap:6px; }
            .calendar-day { min-height:94px; padding:8px; }
            .calendar-month { min-width:0; }
            .doc-item { display:grid; grid-template-columns:32px 1fr auto; gap:8px; align-items:start; }
            .doc-type-icon { grid-column:1; grid-row:1 / span 2; }
            .doc-name-inp { grid-column:2 / 4; }
            .doc-notes-inp { grid-column:2 / 4; width:100%; padding-left:0; }
            .doc-date { grid-column:2; }
            .doc-btn-view,
            .doc-btn-del { grid-row:3; }
            .doc-btn-view { grid-column:2; justify-self:start; }
            .doc-btn-del { grid-column:3; justify-self:end; }
            .mat-hdr, .mat-row-item { min-width:680px; }
            .trade-tasks[style*="padding:0"] { overflow-x:auto; }
        }
        @media (max-width: 640px) {
            body { font-size:14px; }
            .header { gap:10px; padding:10px 12px; }
            .proj-name-badge { max-width:120px; }
            .header-progress { width:100%; margin-left:0; justify-content:flex-end; }
            .hpbar { width:90px; }
            .content { padding:14px 12px; }
            .page-title { font-size:20px; }
            .page-sub { font-size:13px; }
            .add-room-btn,
            .btn,
            .sidebar-add-btn { width:100%; justify-content:center; }
            .sidebar-global,
            .sidebar-section-title { padding-left:12px; padding-right:12px; }
            .nav-item { padding:10px 12px; }
            .room-card,
            .trade-card,
            .project-card,
            .company-card { padding:16px; }
            .measure-row { flex-direction:column; }
            .measure-inp,
            .info-input,
            .cost-input,
            .cost-select,
            .note-cat-sel { width:100%; }
            .task-row { flex-wrap:wrap; align-items:flex-start; }
            .task-text { width:100%; }
            .task-badge { order:4; }
            .task-detail { padding:10px 0 12px 0; }
            .task-notes-preview,
            .task-desc-preview { padding-left:0; }
            .cost-sep { display:none; }
            .detail-cost-row { flex-direction:column; align-items:stretch; }
            .task-add-row { flex-direction:column; align-items:stretch; }
            .trade-hdr,
            .room-group-hdr { flex-wrap:wrap; }

async function sha256(text) {
    const bytes = new TextEncoder().encode(String(text || ''));
    const buffer = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

    localStorage.removeItem(SESSION_KEY);

async function loginUser() {
    const username = document.getElementById('loginUser')?.value.trim().toLowerCase();
    const password = document.getElementById('loginPass')?.value || '';
    const errorEl = document.getElementById('loginError');
    if (errorEl) errorEl.style.display = 'none';
    const user = getUsers().find(item => item.username.toLowerCase() === username && item.active !== false);
    if (!user) {
        if (errorEl) { errorEl.textContent = 'Usuario o contrasena incorrectos.'; errorEl.style.display = 'block'; }
        return;
    }
    const passwordHash = await sha256(password);
    if (passwordHash !== user.passwordHash) {
        if (errorEl) { errorEl.textContent = 'Usuario o contrasena incorrectos.'; errorEl.style.display = 'block'; }
        return;
    }
    state.currentUser = user;
    writeJSON(SESSION_KEY, { userId: user.id });
    state.view = user.mustChangePassword ? 'admin' : 'projects';
    renderAll();

function formatTimeNow() {
    return new Date().toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

function openIdb() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('gestion-obra', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function idbGet(key) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = () => resolve(req.result ?? null);
        req.onerror = () => reject(req.error);
    });
}
async function idbSet(key, value) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}
async function idbDelete(key) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}
async function ensurePermission(handle, write = false) {
    if (!handle) return false;
    const opts = write ? { mode:'readwrite' } : {};
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
}

    try {

            docs: projectDir ? await readFileJson(projectDir, 'docs.json', { entries: emptyDocuments(), blobs: {} }) : { entries: emptyDocuments(), blobs: {} },

async function connectDataFolder() {

        return;

        const handle = await window.showDirectoryPicker({ mode:'readwrite' });
        if (!await ensurePermission(handle, true)) {
            alert('Necesito permiso para leer y escribir en esa carpeta.');
            return;
        }
        fsState.handle = handle;
        await idbSet('dataFolderHandle', handle);
        const hasFolderData = await folderHasProjectData(handle);
        if (hasFolderData) {
            const loadFolder = !state.projects.length || confirm('La carpeta ya tiene datos. Aceptar = cargar lo de la carpeta. Cancelar = conservar lo actual y sobrescribir la carpeta.');
            if (loadFolder) {
                await loadFromConnectedFolder(true);
            } else {
                await persistToFolder('connect');
            }
        } else {
            await persistToFolder('connect');
        }
        refreshStorageStatusUI();
    } catch (err) {
        if (err?.name === 'AbortError') return;
        fsState.error = err?.message || String(err);
        refreshStorageStatusUI();

function buildBackupPayload(includeBlobs = true) {
    const projects = (state.projects || []).map(normalizeProject);
    return {
        version: BACKUP_FILE_VERSION,
        exportedAt: new Date().toISOString(),
        includesBlobs: includeBlobs,
        index: {
            projects,
            currentProjectId: state.currentProjectId,
        },
        projectData: projects.map(project => {
            const keys = projectKeys(project.id);
            const docsStore = readJSON(keys.docs, { entries: emptyDocuments(), blobs: {} });
            const photosStore = readJSON(keys.photos, { blobs: {} });
            return {
                projectId: project.id,
                core: readJSON(keys.core, {
                    rooms: [],
                    tradeInfo: {},
                    companies: [],
                    projectNotes: [],
                    projectCalendar: [],
                    sectionPhotos: {},
                }),
                docs: {
                    entries: docsStore.entries || emptyDocuments(),
                    blobs: includeBlobs ? (docsStore.blobs || {}) : {},
                },
                photos: {
                    blobs: includeBlobs ? (photosStore.blobs || {}) : {},
                },
            };
        }),
    };
}
function applyBackupPayload(payload) {
    if (!payload?.index?.projects || !Array.isArray(payload.index.projects)) {
        throw new Error('La copia no tiene un formato valido.');
    }
    const projects = payload.index.projects.map(normalizeProject);
    state.projects = projects;
    Object.keys(localStorage).forEach(key => {
        if (key.startsWith('obra_project_')) localStorage.removeItem(key);
    });
    projects.forEach(project => {
        const entry = (payload.projectData || []).find(item => item.projectId === project.id) || {};
        const keys = {
            core: `obra_project_${project.storageId}_core_v2`,
            docs: `obra_project_${project.storageId}_docs_v2`,
            photos: `obra_project_${project.storageId}_photos_v2`,
        };
        writeJSON(keys.core, {
            rooms: entry.core?.rooms || [],
            tradeInfo: entry.core?.tradeInfo || {},
            companies: entry.core?.companies || [],
            projectNotes: entry.core?.projectNotes || [],
            projectCalendar: entry.core?.projectCalendar || [],
            sectionPhotos: entry.core?.sectionPhotos || {},
        });
        writeJSON(keys.docs, {
            entries: entry.docs?.entries || emptyDocuments(),
            blobs: entry.docs?.blobs || {},
        });
        writeJSON(keys.photos, {
            blobs: entry.photos?.blobs || {},
        });
    });

        projects,
        currentProjectId: payload.index.currentProjectId || null,
    });
}

function exportBackupFile() {

        const url = URL.createObjectURL(blob);

function collectProjectDocIds(data) {

function collectProjectPhotoIds(data) {

        (entries || []).forEach(entry => { if (entry?.photoId) photoIds.push(entry.photoId); }));
    (data.rooms || []).forEach(room =>

function migrateProjectStorageIfNeeded(projects) {
    const legacyDocs = readJSON('obra_docs_v1', {});
    const legacyPhotos = readJSON('obra_photos_v1', {});
    projects.forEach(project => {
        const normalized = normalizeProject(project);
        const keys = {
            core:   `obra_project_${normalized.storageId}_core_v2`,
            docs:   `obra_project_${normalized.storageId}_docs_v2`,
            photos: `obra_project_${normalized.storageId}_photos_v2`,
        };
        if (localStorage.getItem(keys.core)) return;
        const legacyData = readJSON('obra_proj_' + normalized.id, null);
        if (!legacyData) return;
        const coreData = {
            rooms: legacyData.rooms || [],
            tradeInfo: legacyData.tradeInfo || {},
            companies: legacyData.companies || [],
            projectNotes: legacyData.projectNotes || [],
            projectCalendar: legacyData.projectCalendar || [],
            sectionPhotos: legacyData.sectionPhotos || {},
        };
        const docIds = new Set(collectProjectDocIds(legacyData));
        const photoIds = new Set(collectProjectPhotoIds(legacyData));
        const docBlobs = {};
        const photoBlobs = {};
        docIds.forEach(id => { if (legacyDocs[id]) docBlobs[id] = legacyDocs[id]; });
        photoIds.forEach(id => { if (legacyPhotos[id]) photoBlobs[id] = legacyPhotos[id]; });
        writeJSON(keys.core, coreData);
        writeJSON(keys.docs, { entries: legacyData.documents || emptyDocuments(), blobs: docBlobs });
        writeJSON(keys.photos, { blobs: photoBlobs });
    });
}

function formatEur(n) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
    return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
}
function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
}
function taskCost(task) {
    const q = parseFloat(task.qty), p = parseFloat(task.price);
    return (!isNaN(q) && !isNaN(p) && q > 0 && p > 0) ? q * p : null;
}
function taskBadgeText(task) {
    const q  = parseFloat(task.qty);
    const ul = UNIT_LABEL[task.unit] || task.unit || '';
    const c  = taskCost(task);
    const parts = [];
    if (!isNaN(q) && q > 0 && ul) parts.push(`${q} ${ul}`);
    if (c !== null) parts.push(formatEur(c));
    return parts.join(' · ');
}

function saveIndex() {
    state.projects = state.projects.map(normalizeProject);
    writeJSON('obra_index_v2', {
        projects: state.projects,
        currentProjectId: state.currentProjectId,
    });
    saveEmergencyBackup();
    queueFolderPersist('index');
}
function saveCurrentProject() {
    if (!state.currentProjectId) return;
    const keys = getActiveProjectKeys();
    writeJSON(keys.core, {
        rooms: state.rooms, tradeInfo: state.tradeInfo,
        companies: state.companies, projectNotes: state.projectNotes,
        projectCalendar: state.projectCalendar,
        sectionPhotos: state.sectionPhotos,
    });
    const docsStore = readJSON(keys.docs, { entries: emptyDocuments(), blobs: {} });
    docsStore.entries = state.documents;
    writeJSON(keys.docs, docsStore);
    saveEmergencyBackup();
    queueFolderPersist('project');
}
function saveState() { saveCurrentProject(); }

function loadProject(projectId) {
    saveCurrentProject();
    state.currentProjectId = projectId;
    try {
        const d = getProjectData(projectId);
        state.rooms         = d.rooms;
        state.tradeInfo     = d.tradeInfo;
        state.companies     = d.companies;
        state.projectNotes  = d.projectNotes;
        state.projectCalendar = d.projectCalendar;
        state.sectionPhotos = d.sectionPhotos;
        state.documents     = d.documents;
    } catch(e) {
        state.rooms=[]; state.tradeInfo={}; state.companies=[];
        state.projectNotes=[]; state.projectCalendar=[]; state.sectionPhotos={};
        state.documents=emptyDocuments();
    }
    state.collapsed = {};
    state.view = 'dashboard';
    _photoMode = 'before'; _photoRoomId = null;
    saveIndex();
}

function initState() {
    // Load index
    try {
        const idx = readJSON('obra_index_v2', null) || readJSON('obra_index_v1', {});
        if (Array.isArray(idx.projects) && idx.projects.length) {
            state.projects = idx.projects.map(normalizeProject);
            migrateProjectStorageIfNeeded(state.projects);
            saveIndex();
            if (idx.currentProjectId && state.projects.find(p => p.id === idx.currentProjectId)) {
                loadProject(idx.currentProjectId);
                return;
            }
            state.view = 'projects';
            return;
        }
    } catch(e) {}
    // Migration: old obra_v3 single-project data
    try {
        const old = readJSON('obra_v3', {});
        if (Array.isArray(old.rooms) && old.rooms.length) {
            const projId = uid();
            state.projects = [normalizeProject({ id:projId, name:'Mi Obra', address:'', description:'', color:'#e67e22', createdAt:new Date().toISOString() })];
            const keys = projectKeys(projId);
            writeJSON(keys.core, {
                rooms: old.rooms, tradeInfo: old.tradeInfo || {},
                companies: old.companies || [], projectNotes: old.projectNotes || [],
                projectCalendar: old.projectCalendar || [],
                sectionPhotos: old.sectionPhotos || {},
            });
            writeJSON(keys.docs, { entries: old.documents || emptyDocuments(), blobs: {} });
            writeJSON(keys.photos, { blobs: {} });
            saveIndex();
            loadProject(projId);
            return;
        }
    } catch(e) {}
    // Fresh start
    state.view = 'projects';
}

function storeDoc(docId, base64) {

function dataURLToBlob(dataURL) {
    const arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]); let n = bstr.length;
    const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: mime });
}
function saveDocumentFile(catKey, file) {
    const reader = new FileReader();
    reader.onload = ev => {
        const docId = uid();
        if (!storeDoc(docId, ev.target.result)) return;
        if (!state.documents[catKey]) state.documents[catKey] = [];
        state.documents[catKey].push({
            id: uid(), docId, notes: '',
            name: file.name.replace(/\.[^.]+$/, ''),
            fileType: file.type,
            date: new Date().toISOString(),
        });
        saveState();
        renderAll();
    };
    reader.readAsDataURL(file);
}
function processDocumentFiles(catKey, fileList) {
    const files = Array.from(fileList || []).filter(Boolean);
    if (!files.length) return;
    let pending = files.length;
    files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
            const docId = uid();
            if (storeDoc(docId, ev.target.result)) {
                if (!state.documents[catKey]) state.documents[catKey] = [];
                state.documents[catKey].push({
                    id: uid(), docId, notes: '',
                    name: file.name.replace(/\.[^.]+$/, ''),
                    fileType: file.type,
                    date: new Date().toISOString(),
                });
            }
            pending--;
            if (pending === 0) { saveState(); renderAll(); }
        };
        reader.readAsDataURL(file);
    });
}
function uploadDocument(catKey) {

    input.type = 'file'; input.accept = 'image/*,application/pdf,.doc,.docx,.xls,.xlsx';

function roomProgress(room) {
    let total = 0, done = 0;
    Object.values(room.trades).forEach(tasks => tasks.forEach(t => { total++; if (t.done) done++; }));
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function tradeRoomProgress(room, tid) {
    const tasks = room.trades[tid] || [];
    const done  = tasks.filter(t => t.done).length;
    return { total: tasks.length, done, pct: tasks.length ? Math.round(done/tasks.length*100) : 0 };
}
function tradeGlobalProgress(tid) {
    let total = 0, done = 0;
    state.rooms.forEach(room => (room.trades[tid]||[]).forEach(t => { total++; if (t.done) done++; }));
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function overallProgress() {
    let total = 0, done = 0;
    state.rooms.forEach(r => { const p = roomProgress(r); total += p.total; done += p.done; });
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

// MATERIALS AGGREGATION
// ================================================================

function getMaterialsData() {
    let totalCost = 0, doneCost = 0, pendingCost = 0, noCostCount = 0;
    const byTrade = {};
    Object.keys(TRADES).forEach(tid => { byTrade[tid] = { items:[], total:0, done:0, pending:0 }; });

    state.rooms.forEach(room => {
        const tpl = ROOM_TEMPLATES[room.type];
        Object.entries(room.trades).forEach(([tid, tasks]) => {
            if (!byTrade[tid]) byTrade[tid] = { items:[], total:0, done:0, pending:0 };
            tasks.forEach(task => {
                const cost = taskCost(task);
                const c    = cost ?? 0;
                if (cost === null) noCostCount++;
                byTrade[tid].items.push({ task, room, tpl, cost });
                byTrade[tid].total   += c;
                if (task.done) { byTrade[tid].done    += c; doneCost    += c; }
                else           { byTrade[tid].pending += c; pendingCost += c; }
                totalCost += c;
            });
        });
    });
    return { totalCost, doneCost, pendingCost, noCostCount, byTrade };
}

let _drag = null;
function handleDragStart(e, el) {
    _drag = { roomId: el.dataset.room, tradeId: el.dataset.trade, taskId: el.dataset.task };
    el.querySelector('.task-row').classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e, el) {
    if (!_drag || _drag.roomId !== el.dataset.room || _drag.tradeId !== el.dataset.trade) return;
    e.preventDefault();
    document.querySelectorAll('.task-container').forEach(c => c.classList.remove('drag-over'));
    el.classList.add('drag-over');
}
function handleDragLeave(e, el) {
    if (!e.relatedTarget || !el.contains(e.relatedTarget)) el.classList.remove('drag-over');
}
function handleDrop(e, el) {
    e.preventDefault(); el.classList.remove('drag-over');
    if (!_drag || _drag.taskId === el.dataset.task) { _drag = null; return; }
    if (_drag.roomId !== el.dataset.room || _drag.tradeId !== el.dataset.trade) { _drag = null; return; }
    const room  = state.rooms.find(r => r.id === _drag.roomId);
    if (!room)  { _drag = null; return; }
    const tasks    = room.trades[_drag.tradeId];
    const fromIdx  = tasks.findIndex(t => t.id === _drag.taskId);
    const toIdx    = tasks.findIndex(t => t.id === el.dataset.task);
    if (fromIdx < 0 || toIdx < 0) { _drag = null; return; }
    const [item] = tasks.splice(fromIdx, 1);
    tasks.splice(toIdx, 0, item);
    _drag = null; saveState(); renderAll();
}
function handleDragEnd() {
    _drag = null;
    document.querySelectorAll('.task-container').forEach(c => c.classList.remove('drag-over'));
    document.querySelectorAll('.task-row').forEach(r => r.classList.remove('dragging'));
}

function parseIsoDate(dateStr) {
    if (!dateStr) return null;
    const d = new Date(`${dateStr}T00:00:00`);
    return isNaN(d) ? null : d;
}
function formatIsoDate(date) {
    if (!(date instanceof Date) || isNaN(date)) return '';
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}
function calcDurationDays(startDate, endDate) {
    const start = parseIsoDate(startDate);
    const end = parseIsoDate(endDate);
    if (!start || !end || end < start) return '';
    return Math.floor((end - start) / 86400000) + 1;
}
function calcEndDateFromDuration(startDate, durationDays) {
    const start = parseIsoDate(startDate);
    const days = parseInt(durationDays, 10);
    if (!start || !days || days < 1) return '';
    const end = new Date(start);
    end.setDate(end.getDate() + days - 1);
    return formatIsoDate(end);
}
function tradeDurationHelper(info) {
    const days = parseInt(info?.durationDays, 10);
    if (!days || days < 1) return 'Indica los dias para calcular la fecha final.';
    return `${days} día${days === 1 ? '' : 's'} estimado${days === 1 ? '' : 's'}`;
}
function syncTradeScheduleUI(tid) {

    const durationInput = document.getElementById(`tradeDuration_${tid}`);

    const durationHelp = document.getElementById(`tradeDurationHelp_${tid}`);
    if (endInput) endInput.value = info.endDate || '';
    if (durationInput) durationInput.value = info.durationDays || '';
    if (endHelp) endHelp.textContent = info.endDate ? `Fin: ${formatShortDate(info.endDate)}` : 'Pon inicio y días para calcular la fecha final.';
    if (durationHelp) durationHelp.textContent = tradeDurationHelper(info);
}

    if (!state.tradeInfo[tid]) state.tradeInfo[tid] = getTradeInfo(tid);
    state.tradeInfo[tid][field] = val;
    const info = state.tradeInfo[tid];
    if (field === 'startDate') {
        if (info.startDate && info.durationDays) info.endDate = calcEndDateFromDuration(info.startDate, info.durationDays);
        else if (info.startDate && info.endDate) info.durationDays = calcDurationDays(info.startDate, info.endDate);
    } else if (field === 'endDate') {
        info.durationDays = calcDurationDays(info.startDate, info.endDate);
    } else if (field === 'durationDays') {
        info.endDate = calcEndDateFromDuration(info.startDate, info.durationDays);
    }
    saveState();
    syncTradeScheduleUI(tid);
}

function navigate(view, id) {
    if (view === 'admin' && !isAdmin()) {
        alert('Solo el administrador puede entrar en Administracion.');
        return;
    }
    state.view = view;
    state.currentRoom  = view === 'room'  ? id : null;
    state.currentTrade = view === 'trade' ? id : null;
    renderAll();
    const c = document.getElementById('content');
    if (c) c.scrollTop = 0;
}
function toggleCollapse(key) {
    state.collapsed[key] = !state.collapsed[key];
    const el   = document.getElementById(`body_${key}`);
    const chev = document.getElementById(`chev_${key}`);
    if (el)   el.classList.toggle('collapsed', !!state.collapsed[key]);
    if (chev) chev.textContent = state.collapsed[key] ? '▶' : '▼';
}

let _selType = null;
function openModal() {
    _selType = null;
    document.getElementById('roomNameInput').value = '';
    document.getElementById('addConfirmBtn').disabled = true;
    document.getElementById('typeGrid').innerHTML = Object.entries(ROOM_TEMPLATES).map(([t, tpl]) =>
        `<button class="type-btn" id="tbtn_${t}" onclick="selectType('${t}')">${tpl.icon}<span class="t-name">${tpl.name}</span></button>`
    ).join('');
    document.getElementById('addModal').classList.add('open');
    setTimeout(() => document.getElementById('roomNameInput').focus(), 100);
}
function closeModal(e) {
    if (e && e.target !== document.getElementById('addModal')) return;
    document.getElementById('addModal').classList.remove('open');
}
function selectType(type) {
    const prevType = _selType;
    _selType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById(`tbtn_${type}`)?.classList.add('selected');
    const inp = document.getElementById('roomNameInput');
    const currentName = inp.value.trim();
    const prevAutoName = prevType ? ROOM_TEMPLATES[prevType]?.name : '';
    if (!currentName || currentName === prevAutoName) inp.value = ROOM_TEMPLATES[type].name;
    validateModal(); inp.focus(); inp.select();
}
function validateModal() {
    document.getElementById('addConfirmBtn').disabled =
        !(_selType && document.getElementById('roomNameInput').value.trim());
}
function confirmAdd() {
    const name = document.getElementById('roomNameInput').value.trim();
    if (!_selType || !name) return;
    const room = { id: uid(), type: _selType, name, m2: '', height: '', trades: initRoomTrades(_selType) };
    state.rooms.push(room); saveState();
    document.getElementById('addModal').classList.remove('open');
    state.view = 'room'; state.currentRoom = room.id; renderAll();
}
function isAdmin() {
    return state.currentUser?.role === 'admin';
}
function currentUserLabel() {
    return state.currentUser?.name || state.currentUser?.username || 'Usuario';
}
async function createAdminUser() {
    const name = document.getElementById('newUserName')?.value.trim();
    const username = document.getElementById('newUsername')?.value.trim().toLowerCase();
    const password = document.getElementById('newUserPassword')?.value || '';
    const role = document.getElementById('newUserRole')?.value || 'colaborador';
    if (!name || !username || !password) {
        alert('Completa nombre, usuario y contrasena.');
        return;
    }
    const users = getUsers();
    if (users.some(user => user.username.toLowerCase() === username)) {
        alert('Ese usuario ya existe.');
        return;
    }
    users.push({
        id: uid(),
        username,
        name,
        role,
        active: true,
        mustChangePassword: role !== 'admin',
        passwordHash: await sha256(password),
        createdAt: new Date().toISOString(),
    });
    saveUsers(users);
    ['newUserName','newUsername','newUserPassword'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderAll();
}
async function resetUserPassword(userId) {
    const password = prompt('Nueva contrasena para este usuario:');
    if (!password) return;
    const users = getUsers();
    const user = users.find(item => item.id === userId);
    if (!user) return;
    user.passwordHash = await sha256(password);
    user.mustChangePassword = false;
    saveUsers(users);
    if (state.currentUser?.id === user.id) state.currentUser = user;
    alert('Contrasena actualizada.');
    renderAll();
}
function toggleUserActive(userId) {
    if (state.currentUser?.id === userId) {
        alert('No puedes desactivar tu propio usuario.');
        return;
    }
    const users = getUsers();
    const user = users.find(item => item.id === userId);
    if (!user) return;
    user.active = user.active === false ? true : false;
    saveUsers(users);
    renderAll();
}
async function changeMyPassword() {
    const current = document.getElementById('myCurrentPassword')?.value || '';
    const next = document.getElementById('myNewPassword')?.value || '';
    const repeat = document.getElementById('myRepeatPassword')?.value || '';
    if (!current || !next || !repeat) {
        alert('Completa los tres campos de contrasena.');
        return;
    }
    if (next !== repeat) {
        alert('La nueva contrasena no coincide.');
        return;
    }
    const users = getUsers();
    const user = users.find(item => item.id === state.currentUser?.id);
    if (!user) return;
    if (await sha256(current) !== user.passwordHash) {
        alert('La contrasena actual no es correcta.');
        return;
    }
    user.passwordHash = await sha256(next);
    user.mustChangePassword = false;
    saveUsers(users);
    state.currentUser = user;
    ['myCurrentPassword','myNewPassword','myRepeatPassword'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    alert('Contrasena actualizada.');
    renderAll();
}
function saveAdminSettings() {
    const appName = document.getElementById('adminAppName')?.value.trim() || 'Gestion de Obra';
    const primaryColor = document.getElementById('adminPrimaryColor')?.value || '#e67e22';
    state.settings = { ...state.settings, appName, primaryColor };
    saveSettings();
    renderAll();
}
function renderAdminPanel() {
    const users = getUsers();
    const userRows = users.map(user => `
        <div class="admin-user-item">
            <div>

// ================================================================
// RENDER — MATERIALS (room measures)
// ================================================================

function calcRoomMaterials(m2, height) {
    if (!m2 || !height || m2 <= 0 || height <= 0) return null;
    const side = Math.sqrt(m2), perim = 4*side, wall = perim*height;
    return {
        suelo: m2.toFixed(2), sueloMerma: (m2*1.1).toFixed(2),
        paredes: wall.toFixed(2), perimetro: perim.toFixed(1),
        pintParedes: (wall/12).toFixed(1), pintTecho: (m2/12).toFixed(1),
        pint2m: ((wall+m2)/12*2).toFixed(1), alicMerma: (wall*1.1).toFixed(2),
    };
}
function renderMaterialsInner(room) {
    const m = calcRoomMaterials(parseFloat(room.m2), parseFloat(room.height));
    if (!m) return `<span class="mat-empty">Introduce m² y altura para calcular estimaciones.</span>`;
    return `<div class="materials-grid">
        <div class="mat-item"><div class="mat-lbl">Suelo</div><div class="mat-val">${m.suelo} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Suelo + merma 10%</div><div class="mat-val">${m.sueloMerma} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Paredes (aprox.)</div><div class="mat-val">${m.paredes} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Perímetro (aprox.)</div><div class="mat-val">${m.perimetro} m</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura paredes 1 mano</div><div class="mat-val">~${m.pintParedes} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura techo 1 mano</div><div class="mat-val">~${m.pintTecho} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura total 2 manos</div><div class="mat-val">~${m.pint2m} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Alicatado pared + merma</div><div class="mat-val">${m.alicMerma} m²</div></div>
    </div>`;
}

function renderTaskRow(roomId, tradeId, task) {

        `<option value="${u.v}" ${(task.unit||'ud')===u.v?'selected':''}>${u.l}</option>`
    ).join('');

        ? `<div class="task-date-preview">📅 ${task.startDate ? formatShortDate(task.startDate) : ''}${task.startDate && task.dueDate ? ' → ' : ''}${task.dueDate ? formatShortDate(task.dueDate) : ''}</div>`

    <div class="task-container"
         data-room="${roomId}" data-trade="${tradeId}" data-task="${task.id}"
         ondragover="handleDragOver(event,this)" ondragleave="handleDragLeave(event,this)"
         ondrop="handleDrop(event,this)">
        <div class="task-row" draggable="true"
             ondragstart="handleDragStart(event,this.closest('.task-container'))"
             ondragend="handleDragEnd()"
             onclick="toggleDetail('${task.id}')">
            <span class="drag-handle" onclick="event.stopPropagation()">::</span>
            <div class="task-check ${task.done?'checked':''}" onclick="event.stopPropagation()">OK</div>
            <div style="flex:1;min-width:0">
                <span class="task-text ${task.done?'done':''}">${esc(task.text)}</span>
                ${task.desc ? `<div class="task-desc-preview">${esc(task.desc)}</div>` : ''}
                ${dateLabel}
            </div>
            <span class="task-badge ${badge?'visible':''}" id="badge_${task.id}">${badge}</span>
            ${task.certStatus==='approved' ? '<span class="cert-row-badge" title="Certificado y aprobado">OK</span>'
            : task.certStatus==='revision'  ? '<span class="cert-row-badge" title="Requiere revision">REV</span>'
            : task.certStatus==='pending'   ? '<span class="cert-row-badge" title="Pendiente de aprobacion">PTE</span>' : ''}
            <button id="detailbtn_${task.id}" class="task-detail-btn ${hasData?'has-data':''}"
                title="${hasData?'Ver detalles':'Anadir cantidad / notas'}"
                onclick="event.stopPropagation();toggleDetail('${task.id}')">Ver</button>
            <button class="task-del-btn" title="Eliminar tarea"
                onclick="event.stopPropagation();deleteTask('${roomId}','${tradeId}','${task.id}')">X</button>
        </div>
        ${task.notes && !task.qty && !task.price ? `<div class="task-notes-preview">${esc(task.notes)}</div>` : ''}
        <div id="detail_${task.id}" class="task-detail" style="display:none">
            <div style="margin-bottom:10px">
                <span class="cost-label">Descripcion del trabajo</span>
                <textarea class="task-notes-inp" style="margin-top:4px" placeholder="Describe que se va a realizar, materiales, acabados..."
                    onclick="event.stopPropagation()"
                    onblur="saveTaskField('${roomId}','${task.id}','desc',this.value)">${esc(task.desc||'')}</textarea>
            </div>
            <div class="detail-cost-row">
                <div class="cost-field">
                    <span class="cost-label">Inicio</span>
                    <input class="cost-input" type="date"
                        value="${esc(task.startDate||'')}"
                        onclick="event.stopPropagation()"
                        onblur="saveTaskField('${roomId}','${task.id}','startDate',this.value)">
                </div>
                <div class="cost-field">
                    <span class="cost-label">Fin previsto</span>
                    <input class="cost-input" type="date"
                        value="${esc(task.dueDate||'')}"
                        onclick="event.stopPropagation()"
                        onblur="saveTaskField('${roomId}','${task.id}','dueDate',this.value)">
                </div>
            </div>
            <div class="detail-cost-row">
                <div class="cost-field">
                    <span class="cost-label">Cantidad</span>
                    <input class="cost-input cost-qty" type="number" min="0" step="0.01"
                        value="${esc(task.qty||'')}" placeholder="0"
                        onclick="event.stopPropagation()"
                        oninput="previewCost('${task.id}')"

                    <span class="cost-label">Unidad</span>
                    <select class="cost-select" onclick="event.stopPropagation()"
                        onchange="saveTaskField('${roomId}','${task.id}','unit',this.value)">${unitSel}</select>
                </div>

                <div class="cost-field">
                    <span class="cost-label">EUR / unidad</span>
                    <input class="cost-input cost-price" type="number" min="0" step="0.01"
                        value="${esc(task.price||'')}" placeholder="0,00"
                        onclick="event.stopPropagation()"
                        oninput="previewCost('${task.id}')"
                        onblur="saveTaskField('${roomId}','${task.id}','price',this.value)">
                </div>
                <span class="cost-sep">=</span>
                <div class="cost-total-box">
                    <span class="cost-label">Total</span>
