        <div class="info-field" style="grid-column:1/-1">
            <label class="info-label">Configuración de tiempos</label>
            <textarea class="task-notes-inp" placeholder="Orden del oficio, dependencias, margen, acceso..."
                onblur="updateTradeInfo('${tid}','scheduleNotes',this.value)">${esc(info.scheduleNotes || '')}</textarea>
        </div>
    </div>`;
}

function renderAddTaskRow(roomId, tradeId) {
    return `
    <div class="task-add-row">
        <input class="task-add-inp" id="addinp_${roomId}_${tradeId}" type="text" placeholder="Nueva tarea…"

            onclick="addTask('${roomId}','${tradeId}',document.getElementById('addinp_${roomId}_${tradeId}'))">＋</button>
    </div>`;
}

function renderTradeSection(roomId, tradeId, tasks, colKey) {
    const trade     = TRADES[tradeId] || { name:tradeId, color:'#999', icon:'🔨' };
    const done      = tasks.filter(t => t.done).length;
    const total     = tasks.length;
    const pct       = total ? Math.round(done/total*100) : 0;
    const key       = `${colKey}_${tradeId}`;
    const collapsed = !!state.collapsed[key];
    return `
    <div class="trade-section">
        <div class="trade-hdr" onclick="toggleCollapse('${key}')">
            <div class="trade-accent" style="background:${trade.color}"></div>
            <span class="trade-icon">${trade.icon}</span>
            <span class="trade-name">${trade.name}</span>
            <span class="trade-count">${done}/${total}</span>
            <span class="trade-chevron" id="chev_${key}">${collapsed?'▶':'▼'}</span>
        </div>
        <div class="trade-pbar" style="background:#f0f0f0">
            <div class="trade-pbar-fill" style="width:${pct}%;background:${trade.color}"></div>
        </div>
        <div class="trade-tasks ${collapsed?'collapsed':''}" id="body_${key}">
            ${tasks.map(t => renderTaskRow(roomId, tradeId, t)).join('')}
            ${renderAddTaskRow(roomId, tradeId)}
        </div>
    </div>`;
}

function renderTradeDetail(tid) {
    const trade = TRADES[tid];
    if (!trade) { navigate('trades'); return ''; }
    const p     = tradeGlobalProgress(tid);
    const info  = getTradeInfo(tid);
    const color = pctColor(p.pct);
    const timing = tradeScheduleText(info);
    const roomsWithTrade = state.rooms.filter(r => r.trades[tid]);

    const roomGroups = roomsWithTrade.length === 0

        : roomsWithTrade.map(room => {

}

function renderMaterialsPanel() {
    const data = getMaterialsData();
    const { totalCost, doneCost, pendingCost, noCostCount, byTrade } = data;

    const donePct    = totalCost > 0 ? Math.round(doneCost/totalCost*100)    : 0;
    const pendingPct = totalCost > 0 ? Math.round(pendingCost/totalCost*100) : 0;

    const totalTasks = state.rooms.reduce((n, r) => n + Object.values(r.trades).flat().length, 0);

    const summary = `
        <div class="summary-cards">
            <div class="summary-card s-total">
                <div class="sc-label">Total presupuestado</div>
                <div class="sc-value">${formatEur(totalCost)}</div>
                <div class="sc-tasks">${totalTasks} tareas en total</div>
            </div>
            <div class="summary-card s-done">
                <div class="sc-label">Completado</div>
                <div class="sc-value">${formatEur(doneCost)}</div>
                <div class="sc-pct">${donePct}% del total</div>
            </div>
            <div class="summary-card s-pending">
                <div class="sc-label">Por completar</div>
                <div class="sc-value">${formatEur(pendingCost)}</div>
                <div class="sc-pct">${pendingPct}% del total</div>
            </div>
        </div>`;

    const warning = noCostCount > 0
        ? `<div class="mat-warning">⚠️ ${noCostCount} tarea${noCostCount!==1?'s':''} sin cantidad o precio definido — el presupuesto puede estar incompleto. Usa el botón 📋 en cada tarea para añadir datos.</div>`
        : '';

    const tradeSections = Object.entries(TRADES).map(([tid, trade]) => {
        const td = byTrade[tid];
        if (!td || td.items.length === 0) return '';
        const pct       = td.total > 0 ? Math.round(td.done/td.total*100) : 0;
        const key       = `mат_${tid}`;
        const collapsed = !!state.collapsed[key];

        const rows = td.items.map(({ task, room, tpl, cost }) => {
            const q  = parseFloat(task.qty);
            const p  = parseFloat(task.price);
            const ul = UNIT_LABEL[task.unit] || task.unit || 'ud';
            const hasCost = cost !== null;
            return `
                <div class="mat-row-item">
                    <div class="mat-col-room">${tpl?tpl.icon:'🏠'} ${esc(room.name)}</div>
                    <div class="mat-col-task ${task.done?'is-done':''}" title="${esc(task.text)}">${esc(task.text)}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?q:'—'}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?ul:'—'}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?formatEur(p):'—'}</div>
                    <div class="mat-col-total ${task.done?'cost-done':'cost-pending'}">${hasCost?formatEur(cost):'—'}</div>
                    <div class="mat-col-status">${task.done?'✓':'⏳'}</div>
                </div>`;
        }).join('');

        return `
            <div class="trade-section">
                <div class="trade-hdr" onclick="toggleCollapse('${key}')">
                    <div class="trade-accent" style="background:${trade.color}"></div>
                    <span class="trade-icon">${trade.icon}</span>
                    <span class="trade-name">${trade.name}</span>
                    <span style="flex:1;font-size:12px;color:var(--text-light);margin-left:4px">
                        <span style="color:var(--success)">✓ ${formatEur(td.done)}</span>
                        &nbsp;·&nbsp;
                        <span style="color:var(--primary)">⏳ ${formatEur(td.pending)}</span>
                    </span>
                    <span style="font-size:14px;font-weight:800;color:${pctColor(pct)};min-width:80px;text-align:right">${formatEur(td.total)}</span>
                    <span class="trade-chevron" id="chev_${key}">${collapsed?'▶':'▼'}</span>
                </div>
                <div class="trade-pbar" style="background:#f0f0f0">
                    <div class="trade-pbar-fill" style="width:${pct}%;background:${trade.color}"></div>
                </div>
                <div class="trade-tasks ${collapsed?'collapsed':''}" id="body_${key}" style="padding:0">
                    <div class="mat-hdr">
                        <div>Estancia</div><div>Trabajo</div>
                        <div style="text-align:right">Cant.</div>
                        <div style="text-align:right">Ud.</div>
                        <div style="text-align:right">€/ud</div>
                        <div style="text-align:right">Total</div>
                        <div></div>
                    </div>
                    ${rows}
                </div>
            </div>`;
    }).filter(Boolean).join('');

    const emptyMsg = !tradeSections
        ? `<div class="empty-state" style="padding:30px 0">
               <div style="font-size:40px;margin-bottom:12px">📦</div>
               <h2>Sin datos de costes</h2>
               <p>Añade cantidades y precios a las tareas usando el botón 📋 en cada trabajo.</p>
           </div>` : '';

    return `
        <div class="dash-header">
            <div><div class="page-title">Materiales y Costes</div><div class="page-sub">Resumen económico de la obra por oficio y estado.</div></div>
        </div>
        ${summary}${warning}
        <div style="margin-top:4px">${tradeSections}${emptyMsg}</div>`;
}

function renderDocumentsPanel() {
    const totalDocs = Object.values(state.documents).reduce((n, arr) => n + (arr||[]).length, 0);

    const sections = Object.entries(DOC_CATEGORIES).map(([key, cat]) => {
        const docs = state.documents[key] || [];
        const colKey = 'doc_' + key;
        const collapsed = !!state.collapsed[colKey];

        const rows = docs.map(d => {
            const isPDF = d.fileType === 'application/pdf';
            const isImg = d.fileType?.startsWith('image/');
            const icon  = isPDF ? '📄' : isImg ? '🖼️' : '📎';
            const date  = new Date(d.date).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
            return `
            <div class="doc-item">
                <span class="doc-type-icon">${icon}</span>
                <input class="doc-name-inp" value="${esc(d.name)}" placeholder="Nombre del documento"
                    onblur="saveDocField('${key}','${d.id}','name',this.value)">

        }).join('');

        return `
        <div class="doc-cat-section">
            <div class="doc-cat-hdr" onclick="toggleCollapse('${colKey}')">
                <span class="doc-cat-icon">${cat.icon}</span>
                <div class="doc-cat-info">

                    <div class="doc-cat-desc">${cat.desc}</div>
                </div>

            </div>
            <div class="trade-tasks ${collapsed ? 'collapsed' : ''}" id="body_${colKey}" style="padding:0">
                <div class="doc-list">
                    ${rows || `<div class="doc-empty">Sin documentos en esta categoría.</div>`}
                    <div class="doc-dropzone" id="docdrop_${key}"
                        ondragover="handleDocDragOver(event,'${key}')"
                        ondragleave="handleDocDragLeave('${key}')"
                        ondrop="handleDocDrop(event,'${key}')">
                        Arrastra archivos aquí o usa el botón de añadir
                    </div>
                    <div class="doc-add-row">
                        <button class="btn btn-ghost" style="font-size:13px"
                            onclick="uploadDocument('${key}')">＋ Añadir documento</button>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');

    return `
        <div class="dash-header">
            <div>
                <div class="page-title">Documentación</div>
                <div class="page-sub">Proyecto, planos y permisos · ${totalDocs} documento${totalDocs !== 1 ? 's' : ''}.</div>
            </div>
        </div>
        ${sections}`;
}

function renderProjectsLayout() {
    const cards = state.projects.map(p => {
        // Load project data just for stats (don't change active project)
        let rooms = [];
        try {
            const d = getProjectData(p.id);
            rooms = d.rooms || [];
        } catch(e) {}
        let total = 0, done = 0;
        rooms.forEach(r => Object.values(r.trades||{}).forEach(tasks =>
            tasks.forEach(t => { total++; if (t.done) done++; })));
        const pct = total ? Math.round(done/total*100) : 0;
        const color = pctColor(pct);
        return `
            <div class="project-card" style="--proj-color:${p.color}" onclick="enterProject('${p.id}')">
                <button class="project-edit-btn" onclick="event.stopPropagation();openProjectModal('${p.id}')">⚙️</button>

                    ${p.address     ? `📍 ${esc(p.address)}<br>` : ''}
                    ${p.description ? `${esc(p.description)}`    : ''}
                    ${!p.address && !p.description ? '<span style="color:#ccc">Sin descripción</span>' : ''}
                </div>
                <div class="project-card-stats">
                    <div class="proj-stat">
                        <div class="proj-stat-val" style="color:${color}">${pct}%</div>
                        <div class="proj-stat-lbl">progreso</div>
                    </div>
                    <div class="proj-stat">
                        <div class="proj-stat-val">${done}/${total}</div>
                        <div class="proj-stat-lbl">tareas</div>

    return `

                    ${fsState.handle ? `<button class="btn" onclick="persistToFolder('manual')" style="font-size:13px;padding:8px 14px">Guardar carpeta</button>` : ''}

function resetAllStorage() {
    Object.keys(localStorage).forEach(key => {
        if (key.startsWith('obra_')) localStorage.removeItem(key);
    });

    const CERT_LABELS = { pending:'⏳ Pendiente', approved:'✅ Aprobado', revision:'⚠️ Revisión' };
    const CERT_CLS    = { pending:'cert-pending', approved:'cert-approved', revision:'cert-revision' };

    const certGrid = certTasks.length === 0
        ? `<div class="empty-state" style="padding:30px 0">
               <div style="font-size:40px;margin-bottom:12px">🏅</div>
               <h2>Sin certificaciones todavía</h2>
               <p>Marca trabajos como completados y añade fotos de certificación usando el botón 📋 en cada tarea.</p>
           </div>`
        : `<div class="photo-grid">${certTasks.map(({task,room,trade}) => {
            const src  = getPhoto(task.certPhotoId);
            const date = task.certDate ? new Date(task.certDate).toLocaleDateString('es-ES') : '';
            return src ? `<div class="photo-card">
                <img src="${src}" onclick="openLightbox('${src}')" title="Ver foto">
                <div class="photo-card-body">
                    <div style="font-size:12px;font-weight:600;margin-bottom:3px">${esc(task.text)}</div>
                    <div style="font-size:11px;color:var(--text-light);margin-bottom:4px">${trade?.icon||''} ${trade?.name||''} · ${esc(room.name)}</div>
                    <span class="cert-status-badge ${CERT_CLS[task.certStatus]||'cert-pending'}" style="font-size:10px">
                        ${CERT_LABELS[task.certStatus]||'⏳ Pendiente'}
                    </span>
                    ${task.certComment ? `<div style="font-size:11px;color:#888;margin-top:4px;font-style:italic">${esc(task.certComment)}</div>` : ''}
                    <div style="font-size:10px;color:#ccc;margin-top:3px">${date}</div>
                </div>
            </div>` : '';
        }).join('')}</div>`;

    return `
        <div class="dash-header">
            <div><div class="page-title">Fotos</div><div class="page-sub">Registro fotográfico antes y durante la obra.</div></div>
        </div>
        ${tabs}
        ${certGrid}`;
}

        </div>
        <div class="info-field" style="grid-column:1/-1">

function renderTaskRow(roomId, tradeId, task) {
    const hasData  = !!(task.desc || task.notes || task.qty || task.price || task.startDate || task.dueDate);
    const badge    = taskBadgeText(task);
    const cost     = taskCost(task);
    const unitSel  = UNITS.map(u =>
        `<option value="${u.v}" ${(task.unit||'ud')===u.v?'selected':''}>${u.l}</option>`
    ).join('');
    const dateLabel = task.startDate || task.dueDate
        ? `<div class="task-date-preview">Fecha: ${task.startDate ? formatShortDate(task.startDate) : ''}${task.startDate && task.dueDate ? ' -> ' : ''}${task.dueDate ? formatShortDate(task.dueDate) : ''}</div>`
        : '';

    return `
    <div class="task-container"
         data-room="${roomId}" data-trade="${tradeId}" data-task="${task.id}"
         ondragover="handleDragOver(event,this)" ondragleave="handleDragLeave(event,this)"
         ondrop="handleDrop(event,this)">
        <div class="task-row" draggable="true"
             ondragstart="handleDragStart(event,this.closest('.task-container'))"
             ondragend="handleDragEnd()"
             onclick="toggleDetail('${task.id}')">
            <span class="drag-handle" onclick="event.stopPropagation()">::</span>
            <div class="task-check ${task.done?'checked':''}" onclick="event.stopPropagation()">OK</div>
            <div style="flex:1;min-width:0">
                <span class="task-text ${task.done?'done':''}">${esc(task.text)}</span>
                ${task.desc ? `<div class="task-desc-preview">${esc(task.desc)}</div>` : ''}
                ${dateLabel}
            </div>
            <span class="task-badge ${badge?'visible':''}" id="badge_${task.id}">${badge}</span>
            ${task.certStatus==='approved' ? '<span class="cert-row-badge" title="Certificado y aprobado">OK</span>'
            : task.certStatus==='revision'  ? '<span class="cert-row-badge" title="Requiere revision">REV</span>'
            : task.certStatus==='pending'   ? '<span class="cert-row-badge" title="Pendiente de aprobacion">PTE</span>' : ''}
            <button id="detailbtn_${task.id}" class="task-detail-btn ${hasData?'has-data':''}"
                title="${hasData?'Ver detalles':'Anadir cantidad / notas'}"
                onclick="event.stopPropagation();toggleDetail('${task.id}')">Ver</button>
            <button class="task-del-btn" title="Eliminar tarea"
                onclick="event.stopPropagation();deleteTask('${roomId}','${tradeId}','${task.id}')">X</button>
        </div>
        ${task.notes && !task.qty && !task.price ? `<div class="task-notes-preview">${esc(task.notes)}</div>` : ''}
        <div id="detail_${task.id}" class="task-detail" style="display:none">
            <div style="margin-bottom:10px">
                <span class="cost-label">Descripcion del trabajo</span>
                <textarea class="task-notes-inp" style="margin-top:4px" placeholder="Describe que se va a realizar, materiales, acabados..."
                    onclick="event.stopPropagation()"
                    onblur="saveTaskField('${roomId}','${task.id}','desc',this.value)">${esc(task.desc||'')}</textarea>
            </div>
            <div class="detail-cost-row">
                <div class="cost-field">
                    <span class="cost-label">Inicio</span>
                    <input class="cost-input" type="date"

                <div class="cost-field">

                    <input class="cost-input" type="date"

                        onclick="event.stopPropagation()"
                        onblur="saveTaskField('${roomId}','${task.id}','dueDate',this.value)">

            <div class="detail-cost-row">

                </div>
                <div class="cost-field">
                    <span class="cost-label">Unidad</span>
                    <select class="cost-select" onclick="event.stopPropagation()"
                        onchange="saveTaskField('${roomId}','${task.id}','unit',this.value)">${unitSel}</select>
                </div>
                <span class="cost-sep">x</span>
                <div class="cost-field">
                    <span class="cost-label">EUR / unidad</span>
                    <input class="cost-input cost-price" type="number" min="0" step="0.01"
                        value="${esc(task.price||'')}" placeholder="0,00"

function renderTradeDetail(tid) {
    const trade = TRADES[tid];
    if (!trade) { navigate('trades'); return ''; }
    const p      = tradeGlobalProgress(tid);
    const info   = getTradeInfo(tid);
    const color  = pctColor(p.pct);
    const timing = tradeScheduleText(info);
    const roomsWithTrade = state.rooms.filter(r => r.trades[tid]);

    const roomGroups = roomsWithTrade.length === 0
        ? `<div class="empty-state" style="padding:30px 0"><div style="font-size:32px;margin-bottom:8px">Trabajos</div><p>Ninguna estancia tiene trabajos de este oficio.</p></div>`
        : roomsWithTrade.map(room => {
            const tasks = room.trades[tid];
            const done  = tasks.filter(t => t.done).length;
            const total = tasks.length;
            const pct   = total ? Math.round(done/total*100) : 0;
            const key   = `trd_${tid}_${room.id}`;
            const tpl   = ROOM_TEMPLATES[room.type];
            return `
                <div class="room-group">
                    <div class="room-group-hdr" onclick="toggleCollapse('${key}')">
                        <span style="font-size:18px">${tpl?tpl.icon:'Casa'}</span>
                        <span class="room-group-name">${esc(room.name)}</span>
                        <span class="room-group-count">${done}/${total} · ${pct}%</span>
                        <span class="trade-chevron" id="chev_${key}">${state.collapsed[key]?'▶':'▼'}</span>
                    </div>
                    <div class="trade-pbar" style="background:#f0f0f0">
                        <div class="trade-pbar-fill" style="width:${pct}%;background:${trade.color}"></div>
                    </div>
                    <div class="room-group-tasks ${state.collapsed[key]?'collapsed':''}" id="body_${key}">
                        ${tasks.map(t => renderTaskRow(room.id, tid, t)).join('')}
                        ${renderAddTaskRow(room.id, tid)}
                    </div>
                </div>`;
        }).join('');

    return `
        <button class="back-btn" onclick="navigate('trades')">Volver a oficios</button>
        <div class="detail-header">
            <div class="detail-title-row">
                <span class="detail-big-icon">${trade.icon}</span>
                <div class="detail-name-wrap">
                    <div style="font-size:22px;font-weight:800;padding:2px 4px">${trade.name}</div>
                    <div class="detail-room-sub">${p.done} de ${p.total} tareas en ${roomsWithTrade.length} estancia${roomsWithTrade.length!==1?'s':''}</div>
                    ${timing ? `<div class="detail-room-sub">Planificacion: ${esc(timing)}</div>` : ''}
                </div>
                <div class="detail-pct-badge" style="color:${color}">${p.pct}%</div>
            </div>
            <div class="detail-pbar"><div class="detail-pbar-fill" style="width:${p.pct}%;background:${color}"></div></div>
            <div class="section-label">Datos del oficio</div>
            ${renderTradeInfoSection(tid, info)}

        <div class="section-label" style="margin-top:8px">Trabajos por estancia</div>
        ${roomGroups}`;
}

                <div style="font-size:14px;color:#7f8c8d;line-height:1.6;margin-bottom:18px">Ahora ya no debería quedarse en blanco. Puedes recargar o reiniciar los datos guardados de este navegador.</div>
                <div style="background:#fafafa;border:1px solid #eee;border-radius:12px;padding:14px;font-size:12px;color:#555;white-space:pre-wrap;word-break:break-word;margin-bottom:18px">${esc(err?.message || String(err))}</div>

}

                    <span data-storage-status style="font-size:11px;color:var(--text-light);margin-right:8px">${storageStatusText()}</span>

<!-- ═══════════════════════════════════════════════════════════════
     API SYNC LAYER  –  multi-user support via REST + SSE
     Only activates when running behind the API proxy (not file://)
     Falls back silently to localStorage-only mode otherwise.
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function apiSyncLayer() {
    'use strict';

    // Skip if serving straight from the filesystem
    if (window.location.protocol === 'file:') {
        console.info('[API] Modo local (file://), sync desactivado.');
        return;
    }

    // ── Low-level fetch helper (fire-and-forget friendly) ─────────
    let _lastSaveTs = 0; // used to debounce own-save SSE bounce

    async function apiFetch(path, opts = {}) {
        try {
            const r = await fetch(path, opts);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } catch (e) {
            console.warn('[API]', path, e.message);
            return null;
        }
    }

    // ── Wrap saveIndex ────────────────────────────────────────────
    const _origSaveIndex = window.saveIndex;
    window.saveIndex = function saveIndex() {
        _origSaveIndex();
        _lastSaveTs = Date.now();
        apiFetch('/api/index', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                projects: state.projects,
                currentProjectId: state.currentProjectId,
            }),
        });
    };

    // ── Wrap saveCurrentProject ───────────────────────────────────
    const _origSaveProject = window.saveCurrentProject;
    window.saveCurrentProject = function saveCurrentProject() {
        _origSaveProject();
        if (!state.currentProjectId) return;
        _lastSaveTs = Date.now();
        apiFetch('/api/projects/' + state.currentProjectId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                rooms:           state.rooms,
                tradeInfo:       state.tradeInfo,
                companies:       state.companies,
                projectNotes:    state.projectNotes,
                projectCalendar: state.projectCalendar,
                sectionPhotos:   state.sectionPhotos,
                documents:       state.documents,
            }),
        });
    };

    // ── Helper: apply server project data into state ──────────────
    function applyProjectData(d) {
        if (!d) return false;
        state.rooms           = d.rooms           || state.rooms;
        state.tradeInfo       = d.tradeInfo       || state.tradeInfo;
        state.companies       = d.companies       || state.companies;
        state.projectNotes    = d.projectNotes    || state.projectNotes;
        state.projectCalendar = d.projectCalendar || state.projectCalendar;
        state.sectionPhotos   = d.sectionPhotos   || state.sectionPhotos;
        // documents: only replace metadata entries, not localStorage blobs
        if (d.documents) state.documents = d.documents;
        return true;
    }

    // ── Patch initState: load from API after fast localStorage load ─
    const _origInitState = window.initState;
    window.initState = function initState() {
        _origInitState(); // fast localStorage load
        // Then async-update from server
        (async () => {
            const idx = await apiFetch('/api/index');
            if (!idx || !Array.isArray(idx.projects)) return;
            state.projects = idx.projects.map(normalizeProject);
            const pid = idx.currentProjectId;
            if (pid && state.projects.find(p => p.id === pid)) {
                state.currentProjectId = pid;
                const d = await apiFetch('/api/projects/' + pid);
                if (applyProjectData(d)) state.view = 'dashboard';
            } else if (state.projects.length) {
                state.view = 'projects';
            }
            renderAll();
        })().catch(() => {});
    };

    // ── Patch loadProject: also fetch fresh data from API ─────────
    const _origLoadProject = window.loadProject;
    window.loadProject = function loadProject(projectId) {
        _origLoadProject(projectId);
        (async () => {
            const d = await apiFetch('/api/projects/' + projectId);
            if (applyProjectData(d)) renderAll();
        })().catch(() => {});
    };

    // ── Replace resizeAndUpload: upload directly to /api/photos ───
    window.resizeAndUpload = function resizeAndUpload(callback) {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const MAX = 1400;
                    let w = img.width, h = img.height;
                    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    canvas.toBlob(async blob => {
                        const fd = new FormData();
                        fd.append('file', blob, 'photo.jpg');
                        try {
                            const r = await fetch('/api/photos', { method: 'POST', body: fd });
                            if (r.ok) {
                                const { url } = await r.json();
                                callback(url); // '/api/photos/xxx.jpg'
                                return;
                            }
                        } catch (_) {}
                        // Fallback: base64
                        callback(canvas.toDataURL('image/jpeg', 0.78));
                    }, 'image/jpeg', 0.78);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    // ── Replace addSectionPhoto: store API URL directly as photoId ─
    window.addSectionPhoto = function addSectionPhoto(roomId) {
        resizeAndUpload(photoId => {
            // photoId is now '/api/photos/xxx.jpg' (or base64 on fallback)
            if (photoId.startsWith('data:') && !storePhoto(uid(), photoId)) return;
            if (!state.sectionPhotos[roomId]) state.sectionPhotos[roomId] = [];
            state.sectionPhotos[roomId].push({
                id: uid(), photoId, caption: '', date: new Date().toISOString(),
            });
            saveState(); renderAll();
        });
    };

    // ── Replace uploadCertPhoto: same pattern ─────────────────────
    window.uploadCertPhoto = function uploadCertPhoto(roomId, taskId) {
        resizeAndUpload(photoId => {
            const task = Object.values(
                state.rooms.find(r => r.id === roomId)?.trades || {}
            ).flat().find(t => t.id === taskId);
            if (!task) return;
            if (task.certPhotoId) removePhoto(task.certPhotoId);
            task.certPhotoId = photoId;
            task.certStatus  = 'pending';
            task.certComment = task.certComment || '';
            task.certDate    = new Date().toISOString();
            saveState(); renderAll();
        });
    };

    // ── Patch getPhoto: API URLs returned directly ─────────────────
    window.getPhoto = function getPhoto(photoId) {
        if (!photoId) return null;
        if (photoId.startsWith('/api/')) return photoId;
        return _getPhotoStore().blobs[photoId] || null;
    };

    // ── Patch removePhoto: DELETE from API when needed ─────────────
    const _origRemovePhoto = window.removePhoto;
    window.removePhoto = function removePhoto(photoId) {
        if (photoId && photoId.startsWith('/api/photos/')) {
            apiFetch(photoId, { method: 'DELETE' });
            return; // not in localStorage
        }
        _origRemovePhoto(photoId);
    };

    // ── Replace processDocumentFiles: upload to /api/documents ────
    function _uploadFilesToApi(files, onEntry) {
        if (!files.length) return;
        let pending = files.length;
        files.forEach(file => {
            const fd = new FormData();
            fd.append('file', file, file.name);
            fetch('/api/documents', { method: 'POST', body: fd })
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(({ url, originalName }) => {
                    onEntry({
                        id: uid(), docId: url, notes: '',
                        name: (originalName || file.name).replace(/\.[^.]+$/, ''),
                        fileType: file.type,
                        date: new Date().toISOString(),
                    });
                })
                .catch(() => {
                    // Fallback: base64
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const docId = uid();
                        if (storeDoc(docId, ev.target.result)) {
                            onEntry({
                                id: uid(), docId, notes: '',
                                name: file.name.replace(/\.[^.]+$/, ''),
                                fileType: file.type,
                                date: new Date().toISOString(),
                            });
                        }
                    };
                    reader.readAsDataURL(file);
                })
                .finally(() => { if (--pending === 0) { saveState(); renderAll(); } });
        });
    }

    window.processDocumentFiles = function processDocumentFiles(catKey, fileList) {
        const files = Array.from(fileList || []).filter(Boolean);
        _uploadFilesToApi(files, entry => {
            if (!state.documents[catKey]) state.documents[catKey] = [];
            state.documents[catKey].push(entry);
        });
    };

    window.processTradeDocumentFiles = function processTradeDocumentFiles(tid, fileList) {
        if (!state.tradeInfo[tid]) state.tradeInfo[tid] = getTradeInfo(tid);
        const files = Array.from(fileList || []).filter(Boolean);
        _uploadFilesToApi(files, entry => {
            if (!Array.isArray(state.tradeInfo[tid].tradeDocuments))
                state.tradeInfo[tid].tradeDocuments = [];
            state.tradeInfo[tid].tradeDocuments.push(entry);
        });
    };

    // ── Patch removeDoc: DELETE from API when needed ───────────────
    const _origRemoveDoc = window.removeDoc;
    window.removeDoc = function removeDoc(docId) {
        if (docId && docId.startsWith('/api/documents/')) {
            apiFetch(docId, { method: 'DELETE' });
            return;
        }
        _origRemoveDoc(docId);
    };

    // ── Patch viewDocument: open API URLs directly ─────────────────
    const _origViewDocument = window.viewDocument;
    window.viewDocument = function viewDocument(docId) {
        if (docId && docId.startsWith('/api/')) {
            window.open(docId, '_blank');
            return;
        }
        _origViewDocument(docId);
    };

    // ── Patch delete project: also remove from API ─────────────────
    // The existing deleteProject() calls DELETE /api/projects/:id...
    // we just need to ensure the server.js DELETE also broadcasts.
    // server.js already does broadcast('index-updated') on DELETE. ✓

    // ── SSE: real-time sync between users ─────────────────────────
    let _sseSource = null;
    let _sseRetry  = null;

    function connectSSE() {
        if (_sseSource) { _sseSource.close(); _sseSource = null; }
        _sseSource = new EventSource('/api/events');

        _sseSource.addEventListener('project-updated', async ev => {
            try {
                const { id } = JSON.parse(ev.data);
                if (id !== state.currentProjectId) return;
                // Ignore bounce from our own save (within 3s)
                if (Date.now() - _lastSaveTs < 3000) return;
                const d = await apiFetch('/api/projects/' + id);
                if (applyProjectData(d)) renderAll();
            } catch (_) {}
        });

        _sseSource.addEventListener('index-updated', async () => {
            try {
                if (Date.now() - _lastSaveTs < 3000) return;
                const idx = await apiFetch('/api/index');
                if (!idx) return;
                state.projects = (idx.projects || []).map(normalizeProject);
                // If our project was deleted remotely, exit to project list
                if (state.currentProjectId &&
                    !state.projects.find(p => p.id === state.currentProjectId)) {
                    state.currentProjectId = null;
                    state.view = 'projects';
                }
                renderAll();
            } catch (_) {}
        });

        _sseSource.onerror = () => {
            _sseSource.close();
            _sseSource = null;
            clearTimeout(_sseRetry);
            _sseRetry = setTimeout(connectSSE, 5000);
        };

        console.info('[API] SSE conectado');
    }

    // ── Boot: verify API is available, then start SSE ─────────────
    apiFetch('/api/health').then(h => {
        if (h && h.ok) {
            console.info('[API] Backend disponible ✓ clientes SSE:', h.clients);
            connectSSE();
        } else {
            console.warn('[API] Backend no responde, modo solo-local.');
        }
    });

})();
</script>
</body>
</html>
