<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Obra - Vivienda</title>
        <link rel="stylesheet" href="src/css/app.css">
</head>
<body>

<!-- ── Modal: añadir estancia ── -->
<div class="modal-overlay" id="addModal" onclick="closeModal(event)">
    <div class="modal">
        <div class="modal-title">Nueva estancia</div>
        <div class="modal-sub">Elige el tipo de estancia y ponle un nombre.</div>
        <div class="type-grid" id="typeGrid"></div>
        <div class="modal-field">
            <label class="modal-label" for="roomNameInput">Nombre de la estancia</label>
            <input class="modal-input" id="roomNameInput" type="text" placeholder="Ej: Dormitorio principal"
                oninput="validateModal()" onkeydown="if(event.key==='Enter')confirmAdd()">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" id="addConfirmBtn" onclick="confirmAdd()" disabled>Añadir estancia</button>
        </div>
    </div>
</div>

<!-- ── Modal: proyecto ── -->
<div class="modal-overlay" id="projectModal" onclick="closeProjectModal(event)">
    <div class="modal" style="max-width:560px">
        <div class="modal-title" id="projectModalTitle">Nuevo proyecto</div>
        <div class="modal-field">
            <label class="modal-label">Nombre del proyecto *</label>
            <input class="modal-input" id="projName" type="text" placeholder="Ej: Reforma vivienda calle Mayor"
                onkeydown="if(event.key==='Enter')confirmProject()">
        </div>
        <div class="modal-field">
            <label class="modal-label">Dirección / Ubicación</label>
            <input class="modal-input" id="projAddress" type="text" placeholder="Calle, número, ciudad">
        </div>
        <div class="modal-field">
            <label class="modal-label">Cliente</label>
            <select class="modal-input" id="projClientId"></select>
        </div>
        <div class="modal-field">
            <label class="modal-label">Indicaciones de acceso</label>
            <textarea class="modal-input" id="projLocationNotes" rows="2" style="resize:vertical" placeholder="Portal, planta, cómo llegar, referencia..."></textarea>
        </div>
        <div class="modal-field">
            <label class="modal-label">Descripción</label>
            <textarea class="modal-input" id="projDesc" rows="2" style="resize:vertical" placeholder="Tipo de obra, alcance…"></textarea>
        </div>
        <div class="modal-field">
            <label class="modal-label">Color identificativo</label>
            <div id="projColorPicker" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"></div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Foto de portada</label>
            <div id="projCoverPreview" style="margin-top:8px"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
                <button class="btn btn-ghost" type="button" onclick="uploadProjectCover()">Subir foto</button>
                <button class="btn btn-ghost" type="button" onclick="clearProjectCover()">Quitar foto</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeProjectModal()">Cancelar</button>
            <button class="btn btn-danger" id="projDeleteBtn" style="display:none" onclick="deleteProjectFromModal()">🗑 Eliminar proyecto</button>
            <button class="btn btn-primary" onclick="confirmProject()">Guardar proyecto</button>
        </div>
    </div>
</div>

<!-- ── Lightbox ── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
</div>

<!-- Modal: empresa -->
<div class="modal-overlay" id="companyModal" onclick="closeCompanyModal(event)">
    <div class="modal" style="max-width:760px">
        <div class="modal-title" id="companyModalTitle">Nueva empresa</div>
        <div class="modal-field">
            <label class="modal-label">Nombre de empresa / Razon social *</label>
            <input class="modal-input" id="cmpName" type="text" placeholder="Ej: Construcciones Garcia S.L.">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="modal-field">
                <label class="modal-label">Telefono empresa</label>
                <input class="modal-input" id="cmpPhone" type="tel" placeholder="666 123 456">
            </div>
            <div class="modal-field">
                <label class="modal-label">CIF / NIF</label>
                <input class="modal-input" id="cmpCif" type="text" placeholder="B12345678">
            </div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Email empresa</label>
            <input class="modal-input" id="cmpEmail" type="email" placeholder="empresa@email.com">
        </div>
        <div class="modal-field">
            <label class="modal-label">Direccion fiscal / social</label>
            <input class="modal-input" id="cmpAddress" type="text" placeholder="Calle, numero, ciudad">
        </div>
        <div class="modal-field">
            <label class="modal-label">Oficios que realiza</label>
            <div id="cmpTradesGrid" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
        </div>
        <div class="modal-field">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <label class="modal-label" style="margin:0">Personas de contacto</label>
                <button class="btn btn-ghost" type="button" onclick="addCompanyPerson()" style="padding:8px 12px">+ Anadir persona</button>
            </div>
            <div id="cmpPeopleEditor" style="margin-top:10px"></div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Notas internas</label>
            <textarea class="modal-input" id="cmpNotes" rows="3" style="resize:vertical" placeholder="Garantias, condiciones, observaciones..."></textarea>
        </div>
        <div class="modal-field">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <label class="modal-label" style="margin:0">Historial de notas enviadas</label>
                <button class="btn btn-ghost" type="button" onclick="addCompanyHistoryEntry()" style="padding:8px 12px">+ Anadir nota</button>
            </div>
            <div id="cmpHistoryEditor" style="margin-top:10px"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeCompanyModal()">Cancelar</button>
            <button class="btn btn-danger" id="cmpDeleteBtn" style="display:none" onclick="deleteCompanyFromModal()">Eliminar</button>
            <button class="btn btn-primary" onclick="confirmCompany()">Guardar empresa</button>
        </div>
    </div>
</div>

<!-- Modal: proveedor -->
<div class="modal-overlay" id="supplierModal" onclick="closeSupplierModal(event)">
    <div class="modal" style="max-width:640px">
        <div class="modal-title" id="supplierModalTitle">Nuevo proveedor</div>
        <div class="modal-field">
            <label class="modal-label">Nombre de proveedor *</label>
            <input class="modal-input" id="supName" type="text" placeholder="Ej: Almacen de Materiales Levante">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="modal-field">
                <label class="modal-label">Telefono</label>
                <input class="modal-input" id="supPhone" type="tel" placeholder="666 123 456">
            </div>
            <div class="modal-field">
                <label class="modal-label">CIF / NIF</label>
                <input class="modal-input" id="supCif" type="text" placeholder="B12345678">
            </div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Email</label>
            <input class="modal-input" id="supEmail" type="email" placeholder="proveedor@email.com">
        </div>
        <div class="modal-field">
            <label class="modal-label">Direccion</label>
            <input class="modal-input" id="supAddress" type="text" placeholder="Calle, numero, ciudad">
        </div>
        <div class="modal-field">
            <label class="modal-label">Tipo de suministro</label>
            <div id="supCategoriesGrid" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Notas</label>
            <textarea class="modal-input" id="supNotes" rows="3" style="resize:vertical" placeholder="Condiciones, plazos, observaciones..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeSupplierModal()">Cancelar</button>
            <button class="btn btn-danger" id="supDeleteBtn" style="display:none" onclick="deleteSupplierFromModal()">Eliminar</button>
            <button class="btn btn-primary" onclick="confirmSupplier()">Guardar proveedor</button>
        </div>
    </div>
</div>

<!-- Modal: cliente -->
<div class="modal-overlay" id="clientModal" onclick="closeClientModal(event)">
    <div class="modal" style="max-width:680px">
        <div class="modal-title" id="clientModalTitle">Nuevo cliente</div>
        <div class="modal-field">
            <label class="modal-label">Nombre cliente *</label>
            <input class="modal-input" id="cliName" type="text" placeholder="Ej: Noelia Martínez">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="modal-field">
                <label class="modal-label">Teléfono</label>
                <input class="modal-input" id="cliPhone" type="tel" placeholder="666 123 456">
            </div>
            <div class="modal-field">
                <label class="modal-label">WhatsApp</label>
                <input class="modal-input" id="cliWhatsapp" type="tel" placeholder="666 123 456">
            </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="modal-field">
                <label class="modal-label">Email</label>
                <input class="modal-input" id="cliEmail" type="email" placeholder="cliente@email.com">
            </div>
            <div class="modal-field">
                <label class="modal-label">Estado</label>
                <select class="modal-input" id="cliStatus">
                    <option value="activo">Activo</option>
                    <option value="prospecto">Prospecto</option>
                    <option value="cerrado">Cerrado</option>
                </select>
            </div>
        </div>
        <div class="modal-field">
            <label class="modal-label">Dirección</label>
            <input class="modal-input" id="cliAddress" type="text" placeholder="Calle, número, ciudad">
        </div>
        <div class="modal-field">
            <label class="modal-label">Notas</label>
            <textarea class="modal-input" id="cliNotes" rows="3" style="resize:vertical" placeholder="Necesidades, observaciones, información importante..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeClientModal()">Cancelar</button>
            <button class="btn btn-danger" id="cliDeleteBtn" style="display:none" onclick="deleteClientFromModal()">Eliminar</button>
            <button class="btn btn-primary" onclick="confirmClient()">Guardar cliente</button>
        </div>
    </div>
</div>

<div id="app"></div>

    <script src="src/js/app.js"></script>
</body>
</html>
