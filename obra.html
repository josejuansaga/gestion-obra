<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obra — Vivienda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e67e22; --primary-dark: #d35400;
            --bg: #f0f2f5; --card: #fff;
            --text: #2c3e50; --text-light: #7f8c8d;
            --border: #e0e0e0; --success: #27ae60; --danger: #e74c3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ─── Modal ─── */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.open { display:flex; }
        .modal { background:white; border-radius:16px; padding:28px; width:100%; max-width:540px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto; }
        .modal-title { font-size:20px; font-weight:800; margin-bottom:6px; }
        .modal-sub   { font-size:13px; color:var(--text-light); margin-bottom:22px; }
        .type-grid   { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:22px; }
        .type-btn    { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border:2px solid var(--border); border-radius:10px; cursor:pointer; background:white; transition:all .15s; font-family:inherit; }
        .type-btn:hover    { border-color:var(--primary); background:#fff8f0; }
        .type-btn.selected { border-color:var(--primary); background:#fff3e0; }
        .type-btn .t-icon  { font-size:22px; }
        .type-btn .t-name  { font-size:10px; font-weight:600; text-align:center; }
        .modal-field  { margin-bottom:18px; }
        .modal-label  { font-size:12px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block; }
        .modal-input  { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:15px; font-family:inherit; transition:border-color .15s; }
        .modal-input:focus { outline:none; border-color:var(--primary); }
        .modal-actions { display:flex; gap:10px; justify-content:flex-end; }

        /* ─── Buttons ─── */
        .btn               { padding:10px 20px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; border:none; font-family:inherit; transition:all .15s; }
        .btn-primary       { background:var(--primary); color:white; }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-primary:disabled { background:#ddd; color:#aaa; cursor:not-allowed; }
        .btn-ghost         { background:#f0f0f0; color:var(--text); }
        .btn-ghost:hover   { background:#e5e5e5; }
        .btn-danger        { background:#fdecea; color:var(--danger); }
        .btn-danger:hover  { background:#f5c6c2; }

        /* ─── Header ─── */
        .header { background:#2c3e50; color:white; padding:0 24px; display:flex; align-items:center; gap:14px; height:52px; box-shadow:0 2px 8px rgba(0,0,0,.25); position:sticky; top:0; z-index:100; }
        .header h1   { font-size:17px; font-weight:700; white-space:nowrap; }
        .header-tabs { display:flex; gap:3px; margin-left:14px; }
        .header-tab  { padding:6px 14px; border-radius:6px; font-size:13px; font-weight:600; border:none; cursor:pointer; font-family:inherit; transition:all .15s; color:rgba(255,255,255,.65); background:rgba(255,255,255,.1); }
        .header-tab:hover  { background:rgba(255,255,255,.18); color:white; }
        .header-tab.active { background:var(--primary); color:white; }
        .header-progress   { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:rgba(255,255,255,.6); flex-shrink:0; }
        .hpbar      { width:120px; height:6px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; }
        .hpbar-fill { height:100%; background:var(--primary); border-radius:4px; transition:width .4s; }
        .hpct       { font-size:13px; font-weight:700; color:white; min-width:34px; text-align:right; }

        /* ─── Layout ─── */
        .main { display:flex; height:calc(100vh - 52px); }

        /* ─── Sidebar ─── */
        .sidebar { width:210px; background:white; border-right:1px solid var(--border); flex-shrink:0; display:flex; flex-direction:column; overflow-y:auto; }
        .sidebar-global   { padding:14px 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .sidebar-label    { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); margin-bottom:8px; }
        .sb-pbar-wrap     { display:flex; align-items:center; gap:8px; }
        .sb-pbar          { flex:1; height:5px; background:#e0e0e0; border-radius:3px; overflow:hidden; }
        .sb-pbar-fill     { height:100%; background:var(--primary); border-radius:3px; }
        .sb-pct           { font-size:12px; font-weight:700; color:var(--primary); }
        .sidebar-add-btn  { display:flex; align-items:center; gap:8px; margin:10px 12px 4px; padding:9px 12px; background:#fff3e0; border:1.5px dashed var(--primary); border-radius:9px; cursor:pointer; color:var(--primary-dark); font-size:13px; font-weight:600; font-family:inherit; transition:all .15s; }
        .sidebar-add-btn:hover { background:#ffe0b2; }
        .sidebar-section-title { padding:10px 16px 4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); }
        .nav-item  { display:flex; align-items:center; gap:10px; padding:9px 16px; cursor:pointer; border-left:3px solid transparent; transition:all .15s; flex-shrink:0; }
        .nav-item:hover  { background:#f8f9fa; }
        .nav-item.active { background:#fff3e0; border-left-color:var(--primary); }
        .nav-item.active .nav-name { color:var(--primary-dark); font-weight:600; }
        .nav-icon  { font-size:17px; width:22px; text-align:center; flex-shrink:0; }
        .nav-info  { flex:1; min-width:0; }
        .nav-name  { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .nav-sub   { font-size:10px; color:var(--text-light); margin-top:1px; }
        .nav-mini-bar  { height:3px; background:#e0e0e0; border-radius:2px; margin-top:3px; overflow:hidden; }
        .nav-mini-fill { height:100%; background:var(--primary); border-radius:2px; }
        .nav-trade-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

        /* ─── Content ─── */
        .content { flex:1; padding:24px; overflow-y:auto; }

        /* ─── Page headers ─── */
        .dash-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
        .page-title  { font-size:22px; font-weight:800; margin-bottom:4px; }
        .page-sub    { font-size:14px; color:var(--text-light); }
        .add-room-btn { display:flex; align-items:center; gap:8px; padding:10px 18px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s; flex-shrink:0; }
        .add-room-btn:hover { background:var(--primary-dark); }
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-light); }
        .empty-state .empty-icon { font-size:56px; margin-bottom:16px; }
        .empty-state h2 { font-size:20px; font-weight:700; color:var(--text); margin-bottom:8px; }
        .empty-state p  { font-size:14px; margin-bottom:24px; }

        /* ─── Cards ─── */
        .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
        .room-card  { background:white; border-radius:14px; padding:20px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.07); transition:all .2s; }
        .room-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
        .room-card-top  { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
        .room-card-icon { font-size:28px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:#fff3e0; border-radius:12px; flex-shrink:0; }
        .room-card-name { font-size:16px; font-weight:700; margin-bottom:2px; }
        .room-card-type { font-size:11px; color:var(--text-light); margin-bottom:2px; }
        .room-card-meta { font-size:12px; color:var(--text-light); }
        .card-pbar-row  { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
        .card-pbar-lbl  { font-size:12px; color:var(--text-light); flex:1; }
        .card-pct       { font-size:12px; font-weight:700; }
        .card-pbar      { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin-bottom:12px; }
        .card-pbar-fill { height:100%; border-radius:3px; transition:width .3s; }
        .trade-dots     { display:flex; flex-wrap:wrap; gap:5px; }
        .trade-dot      { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:.3; }
        .trade-dot.done    { opacity:1; }
        .trade-dot.partial { opacity:.65; }

        /* ─── Trade card (oficios grid) ─── */
        .trade-card { background:white; border-radius:14px; padding:20px; cursor:pointer; border:2px solid transparent; box-shadow:0 1px 4px rgba(0,0,0,.07); transition:all .2s; }
        .trade-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.1); }
        .trade-card-top  { display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
        .trade-card-icon { font-size:28px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0; }
        .trade-card-name { font-size:16px; font-weight:700; margin-bottom:4px; }
        .trade-card-info { font-size:12px; color:var(--text-light); line-height:1.7; }
        .trade-card-budget { font-size:15px; font-weight:700; margin-top:4px; }

        /* ─── Summary cards (materiales) ─── */
        .summary-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
        .summary-card  { background:white; border-radius:14px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .summary-card.s-total   { border-left:4px solid #2c3e50; }
        .summary-card.s-done    { border-left:4px solid var(--success); }
        .summary-card.s-pending { border-left:4px solid var(--primary); }
        .sc-label { font-size:11px; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; font-weight:700; }
        .sc-value { font-size:24px; font-weight:800; margin-bottom:4px; }
        .sc-pct   { font-size:13px; color:var(--text-light); }
        .sc-tasks { font-size:12px; color:var(--text-light); margin-top:2px; }
        .mat-warning { background:#fff8e1; border:1px solid #ffe082; border-radius:10px; padding:12px 16px; font-size:13px; color:#7d5a00; margin-bottom:16px; }

        /* ─── Materials table ─── */
        .mat-hdr, .mat-row-item {
            display:grid;
            grid-template-columns: 130px 1fr 56px 44px 90px 90px 28px;
            gap:8px; align-items:center; padding:8px 18px;
        }
        .mat-hdr { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-light); border-bottom:1px solid #eee; background:#fafafa; }
        .mat-row-item { font-size:13px; border-bottom:1px solid #f8f8f8; }
        .mat-row-item:last-child { border-bottom:none; }
        .mat-row-item:hover { background:#fafafa; }
        .mat-col-room  { font-size:11px; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .mat-col-task  { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .mat-col-task.is-done { color:var(--text-light); text-decoration:line-through; }
        .mat-col-num   { text-align:right; color:var(--text-light); }
        .mat-col-total { text-align:right; font-weight:600; }
        .cost-done     { color:var(--success); }
        .cost-pending  { color:var(--primary); }
        .mat-col-status{ text-align:center; }
        .mat-no-cost   { color:#ccc; }

        /* ─── Detail: room / trade ─── */
        .back-btn { display:inline-flex; align-items:center; gap:6px; color:var(--text-light); cursor:pointer; font-size:13px; margin-bottom:18px; border:none; background:none; padding:0; font-family:inherit; }
        .back-btn:hover { color:var(--text); }
        .detail-header { background:white; border-radius:14px; padding:24px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
        .detail-title-row { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
        .detail-big-icon  { font-size:38px; flex-shrink:0; }
        .detail-name-wrap { flex:1; min-width:0; }
        .detail-name-input { font-size:22px; font-weight:800; color:var(--text); border:none; background:transparent; font-family:inherit; width:100%; padding:2px 4px; border-radius:6px; border-bottom:2px solid transparent; transition:border-color .15s; }
        .detail-name-input:hover { border-bottom-color:var(--border); }
        .detail-name-input:focus { outline:none; border-bottom-color:var(--primary); }
        .detail-room-type  { font-size:12px; color:var(--text-light); padding:0 4px; margin-top:2px; }
        .detail-room-sub   { font-size:13px; color:var(--text-light); padding:0 4px; margin-top:1px; }
        .detail-pct-badge  { font-size:30px; font-weight:900; margin-left:auto; flex-shrink:0; }
        .detail-pbar       { height:8px; background:#e0e0e0; border-radius:4px; overflow:hidden; margin-bottom:22px; }
        .detail-pbar-fill  { height:100%; border-radius:4px; transition:width .4s; }
        .detail-actions    { display:flex; justify-content:flex-end; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
        .section-label     { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text-light); margin-bottom:10px; }

        /* Measures + materials */
        .measure-row  { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
        .measure-group{ display:flex; flex-direction:column; gap:4px; }
        .measure-lbl  { font-size:12px; color:var(--text-light); font-weight:500; }
        .measure-inp  { padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; width:140px; transition:border-color .15s; }
        .measure-inp:focus { outline:none; border-color:var(--primary); }
        .materials-box   { background:#fff8f0; border:1px solid #ffe0b2; border-radius:10px; padding:16px; }
        .materials-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--primary-dark); margin-bottom:12px; }
        .materials-grid  { display:flex; flex-wrap:wrap; gap:14px 24px; }
        .mat-item  { min-width:130px; }
        .mat-lbl   { font-size:11px; color:var(--text-light); }
        .mat-val   { font-size:16px; font-weight:700; }
        .mat-empty { font-size:13px; color:#bbb; font-style:italic; }

        /* Trade info (oficios) */
        .trade-info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-bottom:6px; }
        .info-field  { display:flex; flex-direction:column; gap:5px; }
        .info-label  { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-light); }
        .info-input  { padding:9px 13px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:inherit; transition:border-color .15s; }
        .info-input:focus { outline:none; border-color:var(--primary); }

        /* ─── Trade accordion ─── */
        .trade-section  { background:white; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
        .trade-hdr      { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; user-select:none; }
        .trade-hdr:hover{ background:#fafafa; }
        .trade-accent   { width:5px; height:30px; border-radius:3px; flex-shrink:0; }
        .trade-icon     { font-size:17px; }
        .trade-name     { font-size:14px; font-weight:600; flex:1; }
        .trade-count    { font-size:12px; color:var(--text-light); }
        .trade-chevron  { font-size:11px; color:var(--text-light); }
        .trade-pbar     { height:3px; }
        .trade-pbar-fill{ height:100%; transition:width .3s; }
        .trade-tasks           { padding:6px 18px 6px; }
        .trade-tasks.collapsed { display:none; }

        /* ─── Task rows ─── */
        .task-container { border-bottom:1px solid #f5f5f5; }
        .task-container:last-of-type { border-bottom:none; }
        .task-container.drag-over    { box-shadow:0 -2px 0 var(--primary); }
        .task-row  { display:flex; align-items:center; gap:10px; padding:9px 2px; cursor:pointer; border-radius:4px; }
        .task-row:hover { background:#fafafa; }
        .task-row.dragging { opacity:.35; }
        .drag-handle { color:#ccc; font-size:14px; cursor:grab; padding:0 2px; flex-shrink:0; user-select:none; letter-spacing:-2px; }
        .drag-handle:active { cursor:grabbing; }
        .drag-handle:hover  { color:#999; }
        .task-check { width:21px; height:21px; border:2px solid #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; font-size:12px; color:transparent; }
        .task-check.checked { border-color:var(--success); background:var(--success); color:white; }
        .task-text  { font-size:14px; flex:1; }
        .task-text.done { text-decoration:line-through; color:#bbb; }

        /* Task cost badge */
        .task-badge { font-size:11px; color:var(--text-light); background:#f5f5f5; border-radius:10px; padding:2px 8px; white-space:nowrap; flex-shrink:0; display:none; }
        .task-badge.visible { display:inline-block; }

        /* Task action buttons */
        .task-detail-btn { opacity:0; padding:3px 6px; background:none; border:none; font-size:13px; cursor:pointer; border-radius:4px; flex-shrink:0; transition:all .15s; color:var(--text-light); }
        .task-row:hover .task-detail-btn { opacity:1; }
        .task-detail-btn.has-data { opacity:1; color:var(--primary); }
        .task-detail-btn:hover { background:#f0f0f0; }
        .task-del-btn  { opacity:0; padding:3px 7px; background:none; border:none; color:#ccc; font-size:15px; cursor:pointer; border-radius:4px; transition:all .15s; flex-shrink:0; }
        .task-row:hover .task-del-btn { opacity:1; }
        .task-del-btn:hover { background:#fdecea; color:var(--danger); }

        /* Task detail panel (costs + notes) */
        .task-detail      { padding:8px 6px 12px 44px; background:#fafafa; border-top:1px solid #f0f0f0; }
        .detail-cost-row  { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
        .cost-field       { display:flex; flex-direction:column; gap:4px; }
        .cost-sep         { font-size:16px; color:var(--text-light); padding-bottom:8px; font-weight:300; }
        .cost-label       { font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.3px; }
        .cost-input       { width:86px; padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; transition:border-color .15s; }
        .cost-input:focus { outline:none; border-color:var(--primary); }
        .cost-select      { padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:white; cursor:pointer; }
        .cost-select:focus{ outline:none; border-color:var(--primary); }
        .cost-total-box   { display:flex; flex-direction:column; gap:4px; }
        .cost-total       { font-size:16px; font-weight:800; color:var(--text); padding:7px 0; }
        .task-notes-inp   { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; min-height:56px; color:var(--text); transition:border-color .15s; }
        .task-notes-inp:focus { outline:none; border-color:var(--primary); }
        .task-notes-preview { font-size:12px; color:var(--text-light); padding:0 6px 6px 44px; font-style:italic; white-space:pre-wrap; }
        .task-desc-preview  { font-size:12px; color:var(--text-light); padding:2px 6px 4px 46px; line-height:1.5; }

        /* Add-task row */
        .task-add-row { display:flex; align-items:center; gap:8px; padding:10px 2px 6px; border-top:1px dashed #e8e8e8; margin-top:4px; }
        .task-add-inp { flex:1; padding:7px 10px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:13px; font-family:inherit; transition:border-color .15s; }
        .task-add-inp:focus { outline:none; border-color:var(--primary); }
        .task-add-btn { padding:7px 13px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; flex-shrink:0; }
        .task-add-btn:hover { background:var(--primary-dark); }

        /* Room group (trade detail) */
        .room-group     { background:white; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
        .room-group-hdr { display:flex; align-items:center; gap:12px; padding:13px 18px; cursor:pointer; user-select:none; }
        .room-group-hdr:hover { background:#fafafa; }
        .room-group-name  { font-size:14px; font-weight:600; flex:1; }
        .room-group-count { font-size:12px; color:var(--text-light); }
        .room-group-tasks           { padding:6px 18px 6px; }
        .room-group-tasks.collapsed { display:none; }

        ::-webkit-scrollbar       { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }

        /* ─── Companies ─── */

<script>
// ================================================================
// CONSTANTS
// ================================================================

const TRADES = {
    albanileria:  { name:'Albañilería',           color:'#8D6E63', icon:'🧱' },
    fontaneria:   { name:'Fontanería',             color:'#1976D2', icon:'🔧' },
    electricidad: { name:'Electricidad',           color:'#F9A825', icon:'⚡' },
    yeseria:      { name:'Yesería / Tabiques',     color:'#78909C', icon:'🪣' },
    alicatado:    { name:'Alicatado / Solado',     color:'#43A047', icon:'▫️' },
    carpinteria:  { name:'Carpintería',            color:'#5D4037', icon:'🪵' },
    pintura:      { name:'Pintura',                color:'#8E24AA', icon:'🖌️' },
    sanitarios:   { name:'Sanitarios / Griferías', color:'#00838F', icon:'🚿' },
};

// ud=unidad, m2=metro cuadrado, ml=metro lineal, m3=metro cúbico, kg, l=litro, h=hora, pa=partida alzada
const UNITS = [
    { v:'ud', l:'ud'  },
    { v:'m2', l:'m²'  },
    { v:'ml', l:'ml'  },
    { v:'m3', l:'m³'  },
    { v:'kg', l:'kg'  },
    { v:'l',  l:'l'   },
    { v:'h',  l:'h'   },
    { v:'pa', l:'pa'  },
];
const UNIT_LABEL = Object.fromEntries(UNITS.map(u => [u.v, u.l]));

const ROOM_TEMPLATES = {
    salon:       { name:'Salón',          icon:'🛋️', trades:{ albanileria:['Demolición y retirada de escombros','Reparación de grietas y paredes','Preparación y saneado de suelo'], electricidad:['Canalización y tendido de cables','Cajas de mecanismos','Enchufes (bases)','Interruptores / Conmutadores','Puntos de luz','Revisión / conexión al cuadro'], yeseria:['Guarnecido de paredes','Enlucido fino de paredes','Falso techo (si aplica)','Remates y ángulos'], alicatado:['Nivelación y preparación de suelo','Colocación de suelo','Rodapié','Rejuntado'], carpinteria:['Marco de puerta','Puerta interior','Rodapié de madera (si aplica)'], pintura:['Masillado y lijado previo','Imprimación','Primera mano','Segunda mano / Acabado final'] }},
    cocina:      { name:'Cocina',         icon:'🍳', trades:{ albanileria:['Demolición y retirada','Reparación de paredes','Preparación de suelo'], fontaneria:['Toma de agua fría fregadero','Toma de agua caliente fregadero','Desagüe fregadero','Preinstalación lavavajillas','Preinstalación lavadora (si aplica)'], electricidad:['Circuito independiente cocina','Enchufes zona encimera / muebles','Puntos de luz','Extractor / Campana','Horno y vitrocerámica'], alicatado:['Colocación suelo','Rodapié','Alicatado pared / salpicadero','Rejuntado'], carpinteria:['Muebles bajos','Muebles altos','Encimera','Zócalos y ajustes finales'], pintura:['Masillado y lijado (zonas sin alicatar)','Imprimación','Acabado final'] }},
    dormitorio:  { name:'Dormitorio',     icon:'🛏️', trades:{ albanileria:['Demolición y retirada de escombros','Reparación de grietas y paredes'], electricidad:['Canalización y tendido','Enchufes','Interruptores / Conmutadores','Puntos de luz'], yeseria:['Guarnecido de paredes','Enlucido fino','Remates y ángulos'], alicatado:['Nivelación y preparación de suelo','Colocación de suelo','Rodapié','Rejuntado'], carpinteria:['Marco de puerta','Puerta interior','Armario empotrado (si aplica)','Rodapié de madera'], pintura:['Masillado y lijado','Imprimación','Primera mano','Segunda mano / Acabado final'] }},
    bano:        { name:'Baño',           icon:'🚿', trades:{ albanileria:['Demolición completa','Tabiques (si aplica)','Impermeabilización suelo y paredes','Preparación para alicatado'], fontaneria:['Toma fría ducha / bañera','Toma caliente ducha / bañera','Toma fría lavabo','Toma caliente lavabo','Desagüe ducha / bañera','Desagüe lavabo','Conexión inodoro / cisterna'], electricidad:['Puntos de luz','Ventilación mecánica','Enchufe con protección diferencial'], alicatado:['Colocación suelo','Alicatado paredes','Rejuntado','Sellado con silicona en encuentros'], sanitarios:['Inodoro + cisterna','Lavabo','Ducha + plato / Bañera','Grifería ducha','Grifería lavabo','Accesorios (toallero, jabonera, espejo)'], carpinteria:['Marco de puerta','Puerta (ciega / ventilada)','Mueble de lavabo','Espejo / Botiquín'] }},
    aseo:        { name:'Aseo',           icon:'🚽', trades:{ albanileria:['Demolición','Tabiques (si aplica)','Impermeabilización','Preparación para alicatado'], fontaneria:['Toma fría lavabo','Toma caliente lavabo','Desagüe lavabo','Conexión inodoro / cisterna'], electricidad:['Puntos de luz','Ventilación mecánica','Enchufe (si aplica)'], alicatado:['Colocación suelo','Alicatado paredes','Rejuntado','Sellado silicona'], sanitarios:['Inodoro + cisterna','Lavabo','Grifería lavabo','Accesorios (toallero, jabonera, espejo)'], carpinteria:['Marco de puerta','Puerta','Mueble lavabo (si aplica)'] }},
    pasillo:     { name:'Pasillo',        icon:'🚪', trades:{ albanileria:['Demolición y retirada','Reparación de paredes'], electricidad:['Canalización y tendido','Puntos de luz','Interruptores / Conmutadores'], yeseria:['Guarnecido de paredes','Enlucido fino','Remates y ángulos'], alicatado:['Nivelación y preparación de suelo','Colocación de suelo','Rodapié','Rejuntado'], carpinteria:['Marcos de puertas','Puertas interiores','Rodapié'], pintura:['Masillado y lijado','Imprimación','Primera mano','Segunda mano / Acabado'] }},
    salon_cocina:{ name:'Salón-Cocina',   icon:'🏠', trades:{ albanileria:['Demolición y retirada','Eliminación de tabique (si aplica)','Reparación de paredes','Preparación suelo'], fontaneria:['Toma fría fregadero','Toma caliente fregadero','Desagüe fregadero','Preinstalación lavavajillas'], electricidad:['Canalización y tendido','Circuito independiente cocina','Enchufes zona cocina','Enchufes zona salón','Interruptores / Conmutadores','Puntos de luz','Extractor / Campana'], yeseria:['Guarnecido de paredes','Enlucido fino','Falso techo (si aplica)','Remates'], alicatado:['Nivelación y preparación de suelo','Colocación suelo zona cocina','Colocación suelo zona salón','Alicatado salpicadero cocina','Rodapié','Rejuntado'], carpinteria:['Marcos de puertas','Muebles cocina bajos','Muebles cocina altos','Encimera','Rodapié madera zona salón'], pintura:['Masillado y lijado','Imprimación','Primera mano','Acabado final'] }},
    general:     { name:'General / Común',icon:'🏗️', trades:{ albanileria:['Demolición general / Vaciado','Refuerzo de estructura (si aplica)','Reparaciones generales','Saneado de humedades','Limpieza de obra final'], fontaneria:['Llave de paso general','Instalación calentador / caldera','Distribución principal','Bajantes y saneamiento'], electricidad:['Cuadro eléctrico general','Toma de tierra','Acometida eléctrica','Distribución principal por vivienda'], carpinteria:['Puerta de entrada','Ventanas (si aplica)','Persianas / Cierres exteriores'], pintura:['Zonas comunes / Escaleras','Fachada interior (si aplica)'] }},
};

// ================================================================
// STATE
// Task: { id, text, done, notes, qty, unit, price }
// ================================================================

const state = {
    view: 'dashboard',  // dashboard|room|trades|trade|materials|companies|notes
    currentRoom: null,
    currentTrade: null,
    rooms: [],
    collapsed: {},
    tradeInfo: {},      // { tradeId:{ company, phone, budget, companyId } }
    companies: [],      // [{ id, name, phone, email, cif, address, trades:[], notes }]
    projectNotes: [],   // [{ id, date, text, category }]
    sectionPhotos: {},  // { roomId: [{id, photoId, caption, date}] }
};

function uid()  { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pctColor(p) { return p === 100 ? '#27ae60' : '#e67e22'; }

function formatEur(n) {
    if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
    return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function taskCost(task) {
    const q = parseFloat(task.qty), p = parseFloat(task.price);
    return (!isNaN(q) && !isNaN(p) && q > 0 && p > 0) ? q * p : null;
}
function taskBadgeText(task) {
    const q  = parseFloat(task.qty);
    const ul = UNIT_LABEL[task.unit] || task.unit || '';
    const c  = taskCost(task);
    const parts = [];
    if (!isNaN(q) && q > 0 && ul) parts.push(`${q} ${ul}`);
    if (c !== null) parts.push(formatEur(c));
    return parts.join(' · ');
}

function initState() {
    try {
        const p = JSON.parse(localStorage.getItem('obra_v3') || '{}');
        if (Array.isArray(p.rooms))        state.rooms        = p.rooms;
        if (p.tradeInfo)                   state.tradeInfo    = p.tradeInfo;
        if (Array.isArray(p.companies))    state.companies    = p.companies;
        if (Array.isArray(p.projectNotes)) state.projectNotes = p.projectNotes;
        if (p.sectionPhotos)               state.sectionPhotos = p.sectionPhotos;
    } catch(e) {}
}
function saveState() {
    localStorage.setItem('obra_v3', JSON.stringify({
        rooms: state.rooms, tradeInfo: state.tradeInfo,
        companies: state.companies, projectNotes: state.projectNotes,
        sectionPhotos: state.sectionPhotos,
    }));
}

// ================================================================
// PHOTO STORAGE  (separate localStorage key to avoid bloating state)
// ================================================================

function _getPhotoStore() {
    try { return JSON.parse(localStorage.getItem('obra_photos_v1') || '{}'); } catch(e) { return {}; }
}
function storePhoto(photoId, dataUrl) {
    const store = _getPhotoStore();
    store[photoId] = dataUrl;
    try { localStorage.setItem('obra_photos_v1', JSON.stringify(store)); return true; }
    catch(e) { alert('Sin espacio para guardar la foto. Prueba con una imagen más pequeña.'); return false; }
}
function removePhoto(photoId) {
    const store = _getPhotoStore();
    delete store[photoId];
    localStorage.setItem('obra_photos_v1', JSON.stringify(store));
}
function getPhoto(photoId) { return _getPhotoStore()[photoId] || null; }

function resizeAndUpload(callback) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                const MAX = 1400;
                let w = img.width, h = img.height;
                if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };
    input.click();
}

function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

// ================================================================
// SECTION PHOTO ACTIONS
// ================================================================

let _photoMode   = 'before'; // 'before' | 'certs'
let _photoRoomId = null;

function addSectionPhoto(roomId) {
    resizeAndUpload(dataUrl => {
        const photoId = uid();
        if (!storePhoto(photoId, dataUrl)) return;
        if (!state.sectionPhotos[roomId]) state.sectionPhotos[roomId] = [];
        state.sectionPhotos[roomId].push({ id: uid(), photoId, caption: '', date: new Date().toISOString() });
        saveState(); renderAll();
    });
}
function deleteSectionPhoto(roomId, entryId) {
    const arr = state.sectionPhotos[roomId] || [];
    const entry = arr.find(e => e.id === entryId);
    if (entry) removePhoto(entry.photoId);
    state.sectionPhotos[roomId] = arr.filter(e => e.id !== entryId);
    saveState(); renderAll();
}
function saveSectionCaption(roomId, entryId, caption) {
    const entry = (state.sectionPhotos[roomId] || []).find(e => e.id === entryId);
    if (entry) { entry.caption = caption; saveState(); }
}

// ================================================================
// CERT PHOTO ACTIONS
// ================================================================

function uploadCertPhoto(roomId, taskId) {
    resizeAndUpload(dataUrl => {
        const photoId = uid();
        if (!storePhoto(photoId, dataUrl)) return;
        const task = Object.values(state.rooms.find(r => r.id === roomId)?.trades || {}).flat().find(t => t.id === taskId);
        if (!task) return;
        if (task.certPhotoId) removePhoto(task.certPhotoId);
        task.certPhotoId  = photoId;
        task.certStatus   = 'pending';
        task.certComment  = task.certComment || '';
        task.certDate     = new Date().toISOString();
        saveState(); renderAll();
    });
}
function approveCert(roomId, taskId) {
    const task = Object.values(state.rooms.find(r => r.id === roomId)?.trades || {}).flat().find(t => t.id === taskId);
    if (!task) return;
    task.done = true; task.certStatus = 'approved'; task.certComment = '';
    saveState(); renderAll();
}
function requestRevision(roomId, taskId, comment) {
    const task = Object.values(state.rooms.find(r => r.id === roomId)?.trades || {}).flat().find(t => t.id === taskId);
    if (!task) return;
    task.done = false; task.certStatus = 'revision'; task.certComment = comment || '';
    saveState(); renderAll();
}
function openRevisionPrompt(roomId, taskId) {

    if (comment === null) return;

}
function deleteCertPhoto(roomId, taskId) {

    if (!task) return;

    task.certPhotoId = null; task.certStatus = null; task.certComment = ''; task.certDate = null;

function initRoomTrades(type) {
    const trades = {};
    Object.entries(ROOM_TEMPLATES[type].trades).forEach(([tid, tasks]) => {
        trades[tid] = tasks.map(text => ({ id: uid(), text, done: false, notes: '', qty: '', unit: 'ud', price: '' }));
    });
    return trades;
}
function getTradeInfo(tid) { return state.tradeInfo[tid] || { company:'', phone:'', budget:'' }; }
function findTask(taskId) {
    for (const room of state.rooms)
        for (const tasks of Object.values(room.trades)) {
            const t = tasks.find(t => t.id === taskId);
            if (t) return t;

// ================================================================
// PROGRESS
// ================================================================

function roomProgress(room) {
    let total = 0, done = 0;
    Object.values(room.trades).forEach(tasks => tasks.forEach(t => { total++; if (t.done) done++; }));
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function tradeRoomProgress(room, tid) {
    const tasks = room.trades[tid] || [];
    const done  = tasks.filter(t => t.done).length;
    return { total: tasks.length, done, pct: tasks.length ? Math.round(done/tasks.length*100) : 0 };
}
function tradeGlobalProgress(tid) {
    let total = 0, done = 0;
    state.rooms.forEach(room => (room.trades[tid]||[]).forEach(t => { total++; if (t.done) done++; }));
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}
function overallProgress() {
    let total = 0, done = 0;
    state.rooms.forEach(r => { const p = roomProgress(r); total += p.total; done += p.done; });
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

// ================================================================
// MATERIALS AGGREGATION
// ================================================================

function getMaterialsData() {
    let totalCost = 0, doneCost = 0, pendingCost = 0, noCostCount = 0;
    const byTrade = {};
    Object.keys(TRADES).forEach(tid => { byTrade[tid] = { items:[], total:0, done:0, pending:0 }; });

    state.rooms.forEach(room => {
        const tpl = ROOM_TEMPLATES[room.type];
        Object.entries(room.trades).forEach(([tid, tasks]) => {
            if (!byTrade[tid]) byTrade[tid] = { items:[], total:0, done:0, pending:0 };
            tasks.forEach(task => {
                const cost = taskCost(task);
                const c    = cost ?? 0;
                if (cost === null) noCostCount++;
                byTrade[tid].items.push({ task, room, tpl, cost });
                byTrade[tid].total   += c;
                if (task.done) { byTrade[tid].done    += c; doneCost    += c; }
                else           { byTrade[tid].pending += c; pendingCost += c; }
                totalCost += c;
            });
        });
    });
    return { totalCost, doneCost, pendingCost, noCostCount, byTrade };
}

let _drag = null;
function handleDragStart(e, el) {
    _drag = { roomId: el.dataset.room, tradeId: el.dataset.trade, taskId: el.dataset.task };
    el.querySelector('.task-row').classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e, el) {
    if (!_drag || _drag.roomId !== el.dataset.room || _drag.tradeId !== el.dataset.trade) return;
    e.preventDefault();
    document.querySelectorAll('.task-container').forEach(c => c.classList.remove('drag-over'));
    el.classList.add('drag-over');
}
function handleDragLeave(e, el) {
    if (!e.relatedTarget || !el.contains(e.relatedTarget)) el.classList.remove('drag-over');
}
function handleDrop(e, el) {
    e.preventDefault(); el.classList.remove('drag-over');
    if (!_drag || _drag.taskId === el.dataset.task) { _drag = null; return; }
    if (_drag.roomId !== el.dataset.room || _drag.tradeId !== el.dataset.trade) { _drag = null; return; }
    const room  = state.rooms.find(r => r.id === _drag.roomId);
    if (!room)  { _drag = null; return; }
    const tasks    = room.trades[_drag.tradeId];
    const fromIdx  = tasks.findIndex(t => t.id === _drag.taskId);
    const toIdx    = tasks.findIndex(t => t.id === el.dataset.task);
    if (fromIdx < 0 || toIdx < 0) { _drag = null; return; }
    const [item] = tasks.splice(fromIdx, 1);
    tasks.splice(toIdx, 0, item);
    _drag = null; saveState(); renderAll();
}
function handleDragEnd() {
    _drag = null;
    document.querySelectorAll('.task-container').forEach(c => c.classList.remove('drag-over'));
    document.querySelectorAll('.task-row').forEach(r => r.classList.remove('dragging'));
}

function toggleTask(roomId, taskId) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;
    for (const tasks of Object.values(room.trades)) {
        const t = tasks.find(t => t.id === taskId);
        if (t) { t.done = !t.done; break; }
    }
    saveState(); renderAll();
}
function deleteTask(roomId, tradeId, taskId) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room?.trades[tradeId]) return;
    room.trades[tradeId] = room.trades[tradeId].filter(t => t.id !== taskId);
    saveState(); renderAll();
}
function addTask(roomId, tradeId, inputEl) {
    const text = inputEl.value.trim();
    if (!text) return;
    const room = state.rooms.find(r => r.id === roomId);
    if (!room?.trades[tradeId]) return;
    room.trades[tradeId].push({ id: uid(), text, done: false, notes: '', qty: '', unit: 'ud', price: '' });
    saveState(); renderAll();
    const inp = document.getElementById(`addinp_${roomId}_${tradeId}`);
    if (inp) inp.focus();
}

function saveTaskField(roomId, taskId, field, value) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;
    const task = Object.values(room.trades).flat().find(t => t.id === taskId);
    if (!task) return;
    task[field] = value;
    saveState();
    // Update badge in DOM without full re-render
    const badge = document.getElementById(`badge_${taskId}`);
    if (badge) {
        const txt = taskBadgeText(task);
        badge.textContent = txt;
        badge.classList.toggle('visible', !!txt);
    }
    // Update detail btn style
    const btn = document.getElementById(`detailbtn_${taskId}`);
    if (btn) btn.classList.toggle('has-data', !!(task.notes || task.qty || task.price));
    // Update cost total display in detail panel
    previewCost(taskId);
}

function toggleDetail(taskId) {
    const wrap = document.getElementById(`detail_${taskId}`);
    if (!wrap) return;
    const visible = wrap.style.display !== 'none';
    wrap.style.display = visible ? 'none' : 'block';
    if (!visible) wrap.querySelector('input,textarea')?.focus();
}

function previewCost(taskId) {
    const detail = document.getElementById(`detail_${taskId}`);
    if (!detail) return;
    const qtyEl   = detail.querySelector('.cost-qty');
    const priceEl = detail.querySelector('.cost-price');
    const totalEl = document.getElementById(`costtotal_${taskId}`);
    if (!totalEl) return;
    const q = parseFloat(qtyEl?.value), p = parseFloat(priceEl?.value);
    totalEl.textContent = (!isNaN(q) && !isNaN(p) && q > 0 && p > 0) ? formatEur(q * p) : '—';
}

// ================================================================
// RENDER — MATERIALS (room measures)
// ================================================================

function calcRoomMaterials(m2, height) {
    if (!m2 || !height || m2 <= 0 || height <= 0) return null;
    const side = Math.sqrt(m2), perim = 4*side, wall = perim*height;
    return {
        suelo: m2.toFixed(2), sueloMerma: (m2*1.1).toFixed(2),
        paredes: wall.toFixed(2), perimetro: perim.toFixed(1),
        pintParedes: (wall/12).toFixed(1), pintTecho: (m2/12).toFixed(1),
        pint2m: ((wall+m2)/12*2).toFixed(1), alicMerma: (wall*1.1).toFixed(2),
    };
}
function renderMaterialsInner(room) {
    const m = calcRoomMaterials(parseFloat(room.m2), parseFloat(room.height));
    if (!m) return `<span class="mat-empty">Introduce m² y altura para calcular estimaciones.</span>`;
    return `<div class="materials-grid">
        <div class="mat-item"><div class="mat-lbl">Suelo</div><div class="mat-val">${m.suelo} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Suelo + merma 10%</div><div class="mat-val">${m.sueloMerma} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Paredes (aprox.)</div><div class="mat-val">${m.paredes} m²</div></div>
        <div class="mat-item"><div class="mat-lbl">Perímetro (aprox.)</div><div class="mat-val">${m.perimetro} m</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura paredes 1 mano</div><div class="mat-val">~${m.pintParedes} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura techo 1 mano</div><div class="mat-val">~${m.pintTecho} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Pintura total 2 manos</div><div class="mat-val">~${m.pint2m} L</div></div>
        <div class="mat-item"><div class="mat-lbl">Alicatado pared + merma</div><div class="mat-val">${m.alicMerma} m²</div></div>
    </div>`;
}

function renderSidebar() {
    const op = overallProgress();
    const inOficiosSection   = state.view === 'trades'    || state.view === 'trade';
    const inMaterialsSection = state.view === 'materials';
    const inCompaniesSection = state.view === 'companies';
    const inNotesSection     = state.view === 'notes';

    let nav = '', addBtn = '', sectionTitle = '';

    if (!inOficiosSection && !inMaterialsSection && !inCompaniesSection && !inNotesSection) {
        sectionTitle = 'Estancias';
        addBtn = `<button class="sidebar-add-btn" onclick="openModal()">＋ Nueva estancia</button>`;
        nav = state.rooms.map(room => {
            const tpl    = ROOM_TEMPLATES[room.type];
            const p      = roomProgress(room);
            const active = state.view === 'room' && state.currentRoom === room.id;
            return `<div class="nav-item ${active?'active':''}" onclick="navigate('room','${room.id}')">
                <span class="nav-icon">${tpl?tpl.icon:'🏠'}</span>
                <div class="nav-info">
                    <div class="nav-name" id="sbname_${room.id}">${esc(room.name)}</div>
                    <div class="nav-sub">${p.done}/${p.total} tareas</div>
                    <div class="nav-mini-bar"><div class="nav-mini-fill" style="width:${p.pct}%"></div></div>
                </div>
            </div>`;
        }).join('') || '<div style="padding:16px;font-size:12px;color:var(--text-light);text-align:center">Sin estancias</div>';
    } else if (inOficiosSection) {
        sectionTitle = 'Oficios';
        nav = Object.entries(TRADES).map(([tid, trade]) => {
            const p      = tradeGlobalProgress(tid);
            const info   = getTradeInfo(tid);
            const active = state.view === 'trade' && state.currentTrade === tid;
            return `<div class="nav-item ${active?'active':''}" onclick="navigate('trade','${tid}')">
                <div class="nav-trade-dot" style="background:${trade.color}"></div>
                <div class="nav-info">
                    <div class="nav-name">${trade.icon} ${trade.name}</div>
                    <div class="nav-sub">${info.company||'Sin empresa'} · ${p.done}/${p.total}</div>

        sectionTitle = 'Materiales';
        const data = getMaterialsData();
        nav = `<div style="padding:12px 16px">
            <div style="font-size:12px;color:var(--text-light);margin-bottom:6px">Presupuestado</div>
            <div style="font-size:15px;font-weight:700">${formatEur(data.totalCost)}</div>
            <div style="height:1px;background:var(--border);margin:10px 0"></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span style="color:var(--success)">✓ Completado</span>
                <span style="font-weight:600">${formatEur(data.doneCost)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px">
                <span style="color:var(--primary)">⏳ Pendiente</span>
                <span style="font-weight:600">${formatEur(data.pendingCost)}</span>
            </div>
        </div>`;
    } else if (state.view === 'photos') {
        sectionTitle = 'Fotos';
        const totalBefore = Object.values(state.sectionPhotos).reduce((n,a) => n + a.length, 0);
        const certTasks   = state.rooms.flatMap(r => Object.values(r.trades).flat().filter(t => t.certPhotoId));
        const approved    = certTasks.filter(t => t.certStatus === 'approved').length;
        const pending     = certTasks.filter(t => t.certStatus === 'pending').length;
        const revision    = certTasks.filter(t => t.certStatus === 'revision').length;
        nav = `<div style="padding:12px 16px;font-size:12px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between"><span style="color:var(--text-light)">Fotos previas</span><strong>${totalBefore}</strong></div>
            <div style="height:1px;background:var(--border)"></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--success)">✅ Aprobadas</span><strong>${approved}</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--primary)">⏳ Pendientes</span><strong>${pending}</strong></div>
            <div style="display:flex;justify-content:space-between"><span style="color:var(--danger)">⚠️ Revisión</span><strong>${revision}</strong></div>
        </div>`;
    } else if (inCompaniesSection) {
        sectionTitle = 'Empresas';
        addBtn = `<button class="sidebar-add-btn" onclick="openCompanyModal()">＋ Nueva empresa</button>`;
        nav = state.companies.length === 0
            ? '<div style="padding:16px;font-size:12px;color:var(--text-light);text-align:center">Sin empresas</div>'
            : state.companies.map(c => {

                return `<div class="nav-item" onclick="openCompanyModal('${c.id}')">

                    <div class="nav-info">
                        <div class="nav-name">${esc(c.name)}</div>
                        <div class="nav-sub">${c.phone||'Sin teléfono'}${icons?' · '+icons:''}</div>
                    </div>
                </div>`;
            }).join('');
    } else {
        sectionTitle = 'Notas';
        const cats = { df:0, gestora:0, general:0 };
        state.projectNotes.forEach(n => { cats[n.category] = (cats[n.category]||0)+1; });
        nav = `<div style="padding:12px 16px">
            <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">${state.projectNotes.length} nota${state.projectNotes.length!==1?'s':''}</div>

                    <span class="note-cat-badge note-cat-gestora" style="font-size:10px">Gestora</span>
                    <span style="font-weight:700">${cats.gestora}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span class="note-cat-badge note-cat-general" style="font-size:10px">General</span>
                    <span style="font-weight:700">${cats.general}</span>
                </div>
            </div>
        </div>`;
    }

    return `
        <div class="sidebar-global">
            <div class="sidebar-label">Progreso global</div>
            <div class="sb-pbar-wrap">
                <div class="sb-pbar"><div class="sb-pbar-fill" style="width:${op.pct}%"></div></div>

function renderCertSection(roomId, task) {
    const CERT_LABELS = { pending:'⏳ Pendiente de aprobación', approved:'✅ Aprobado', revision:'⚠️ Requiere revisión' };
    const CERT_CLS    = { pending:'cert-pending', approved:'cert-approved', revision:'cert-revision' };
    const photo = task.certPhotoId ? getPhoto(task.certPhotoId) : null;
    const date  = task.certDate ? new Date(task.certDate).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}) : '';

    return `<div class="cert-section" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span class="cost-label">Certificación</span>
            ${task.certStatus
                ? `<span class="cert-status-badge ${CERT_CLS[task.certStatus]}">${CERT_LABELS[task.certStatus]}</span>
                   ${date ? `<span style="font-size:11px;color:var(--text-light)">${date}</span>` : ''}`
                : '<span style="font-size:12px;color:var(--text-light)">Sin foto de certificación</span>'}
        </div>
        ${photo ? `<div class="cert-photo-wrap">
            <img src="${photo}" onclick="openLightbox('${photo}')" title="Ver foto">
        </div>` : ''}
        ${task.certStatus === 'revision' && task.certComment
            ? `<div class="cert-comment-display">💬 ${esc(task.certComment)}</div>` : ''}
        <div class="cert-actions">
            <button class="cert-btn cert-btn-photo" onclick="uploadCertPhoto('${roomId}','${task.id}')">
                📷 ${photo ? 'Cambiar foto' : 'Añadir foto'}
            </button>
            ${task.certStatus !== 'approved' ? `
            <button class="cert-btn cert-btn-approve" onclick="approveCert('${roomId}','${task.id}')">✅ Aprobar</button>
            <button class="cert-btn cert-btn-revision" onclick="openRevisionPrompt('${roomId}','${task.id}')">⚠️ Pedir revisión</button>` : `
            <button class="cert-btn cert-btn-revision" onclick="openRevisionPrompt('${roomId}','${task.id}')">⚠️ Reabrir</button>`}
            ${photo ? `<button class="cert-btn" style="color:#ccc;border-color:#eee" onclick="deleteCertPhoto('${roomId}','${task.id}')">✕ Foto</button>` : ''}
        </div>
    </div>`;
}

function renderMaterialsPanel() {
    const data = getMaterialsData();
    const { totalCost, doneCost, pendingCost, noCostCount, byTrade } = data;

    const donePct    = totalCost > 0 ? Math.round(doneCost/totalCost*100)    : 0;
    const pendingPct = totalCost > 0 ? Math.round(pendingCost/totalCost*100) : 0;

    const totalTasks = state.rooms.reduce((n, r) => n + Object.values(r.trades).flat().length, 0);

    const summary = `
        <div class="summary-cards">
            <div class="summary-card s-total">
                <div class="sc-label">Total presupuestado</div>
                <div class="sc-value">${formatEur(totalCost)}</div>
                <div class="sc-tasks">${totalTasks} tareas en total</div>
            </div>
            <div class="summary-card s-done">
                <div class="sc-label">Completado</div>
                <div class="sc-value">${formatEur(doneCost)}</div>
                <div class="sc-pct">${donePct}% del total</div>
            </div>
            <div class="summary-card s-pending">
                <div class="sc-label">Por completar</div>
                <div class="sc-value">${formatEur(pendingCost)}</div>
                <div class="sc-pct">${pendingPct}% del total</div>
            </div>
        </div>`;

    const warning = noCostCount > 0
        ? `<div class="mat-warning">⚠️ ${noCostCount} tarea${noCostCount!==1?'s':''} sin cantidad o precio definido — el presupuesto puede estar incompleto. Usa el botón 📋 en cada tarea para añadir datos.</div>`
        : '';

    const tradeSections = Object.entries(TRADES).map(([tid, trade]) => {
        const td = byTrade[tid];
        if (!td || td.items.length === 0) return '';
        const pct       = td.total > 0 ? Math.round(td.done/td.total*100) : 0;
        const key       = `mат_${tid}`;
        const collapsed = !!state.collapsed[key];

        const rows = td.items.map(({ task, room, tpl, cost }) => {
            const q  = parseFloat(task.qty);
            const p  = parseFloat(task.price);
            const ul = UNIT_LABEL[task.unit] || task.unit || 'ud';
            const hasCost = cost !== null;
            return `
                <div class="mat-row-item">
                    <div class="mat-col-room">${tpl?tpl.icon:'🏠'} ${esc(room.name)}</div>
                    <div class="mat-col-task ${task.done?'is-done':''}" title="${esc(task.text)}">${esc(task.text)}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?q:'—'}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?ul:'—'}</div>
                    <div class="mat-col-num ${hasCost?'':'mat-no-cost'}">${hasCost?formatEur(p):'—'}</div>
                    <div class="mat-col-total ${task.done?'cost-done':'cost-pending'}">${hasCost?formatEur(cost):'—'}</div>
                    <div class="mat-col-status">${task.done?'✓':'⏳'}</div>
                </div>`;
        }).join('');

        return `
            <div class="trade-section">
                <div class="trade-hdr" onclick="toggleCollapse('${key}')">
                    <div class="trade-accent" style="background:${trade.color}"></div>
                    <span class="trade-icon">${trade.icon}</span>
                    <span class="trade-name">${trade.name}</span>
                    <span style="flex:1;font-size:12px;color:var(--text-light);margin-left:4px">
                        <span style="color:var(--success)">✓ ${formatEur(td.done)}</span>
                        &nbsp;·&nbsp;
                        <span style="color:var(--primary)">⏳ ${formatEur(td.pending)}</span>
                    </span>
                    <span style="font-size:14px;font-weight:800;color:${pctColor(pct)};min-width:80px;text-align:right">${formatEur(td.total)}</span>
                    <span class="trade-chevron" id="chev_${key}">${collapsed?'▶':'▼'}</span>
                </div>
                <div class="trade-pbar" style="background:#f0f0f0">
                    <div class="trade-pbar-fill" style="width:${pct}%;background:${trade.color}"></div>
                </div>
                <div class="trade-tasks ${collapsed?'collapsed':''}" id="body_${key}" style="padding:0">
                    <div class="mat-hdr">
                        <div>Estancia</div><div>Trabajo</div>
                        <div style="text-align:right">Cant.</div>
                        <div style="text-align:right">Ud.</div>
                        <div style="text-align:right">€/ud</div>
                        <div style="text-align:right">Total</div>
                        <div></div>
                    </div>
                    ${rows}
                </div>
            </div>`;
    }).filter(Boolean).join('');

    const emptyMsg = !tradeSections
        ? `<div class="empty-state" style="padding:30px 0">
               <div style="font-size:40px;margin-bottom:12px">📦</div>
               <h2>Sin datos de costes</h2>
               <p>Añade cantidades y precios a las tareas usando el botón 📋 en cada trabajo.</p>
           </div>` : '';

    return `
        <div class="dash-header">
            <div><div class="page-title">Materiales y Costes</div><div class="page-sub">Resumen económico de la obra por oficio y estado.</div></div>
        </div>
        ${summary}${warning}
        <div style="margin-top:4px">${tradeSections}${emptyMsg}</div>`;
}

// ================================================================
// RENDER — PHOTOS PANEL
// ================================================================

function renderPhotosPanel() {
    const tabs = `
        <div class="photo-section-tabs">
            <button class="photo-tab ${_photoMode==='before'?'active':''}" onclick="_photoMode='before';renderAll()">📷 Antes de la obra</button>
            <button class="photo-tab ${_photoMode==='certs'?'active':''}"  onclick="_photoMode='certs';renderAll()">🏅 Certificaciones</button>
        </div>`;

    if (_photoMode === 'before') {
        if (!state.rooms.length) return `
            <div class="dash-header"><div><div class="page-title">Fotos</div></div></div>
            ${tabs}
            <div class="empty-state"><div class="empty-icon">📷</div><h2>Sin estancias</h2><p>Añade estancias primero para organizar las fotos.</p></div>`;

        if (!_photoRoomId || !state.rooms.find(r => r.id === _photoRoomId))
            _photoRoomId = state.rooms[0].id;

        const roomBtns = state.rooms.map(r => {
            const count = (state.sectionPhotos[r.id] || []).length;
            return `<button class="photo-room-btn ${r.id===_photoRoomId?'active':''}"
                onclick="_photoRoomId='${r.id}';renderAll()">
                ${ROOM_TEMPLATES[r.type]?.icon||'🏠'} ${esc(r.name)}${count?` <span style="opacity:.6">(${count})</span>`:''}
            </button>`;
        }).join('');

        const entries = state.sectionPhotos[_photoRoomId] || [];
        const grid = `<div class="photo-grid">
            ${entries.map(e => {
                const src = getPhoto(e.photoId);
                if (!src) return '';
                return `<div class="photo-card">
                    <img src="${src}" onclick="openLightbox('${src}')" title="Ver foto">
                    <button class="photo-del-btn" onclick="deleteSectionPhoto('${_photoRoomId}','${e.id}')">✕</button>
                    <div class="photo-card-body">
                        <input class="photo-caption-inp" value="${esc(e.caption)}" placeholder="Añade descripción…"
                            onblur="saveSectionCaption('${_photoRoomId}','${e.id}',this.value)">
                        <div style="font-size:10px;color:#ccc;margin-top:2px">${new Date(e.date).toLocaleDateString('es-ES')}</div>
                    </div>
                </div>`;
            }).join('')}
            <button class="photo-add-btn" onclick="addSectionPhoto('${_photoRoomId}')">
                <span class="pa-icon">＋</span>
                <span>Añadir foto</span>
            </button>
        </div>`;

        return `
            <div class="dash-header">
                <div><div class="page-title">Fotos</div><div class="page-sub">Registro fotográfico antes y durante la obra.</div></div>
            </div>
            ${tabs}
            <div class="photo-room-selector">${roomBtns}</div>
            ${grid}`;
    }

    // ── Certificaciones ──
    const certTasks = [];
    state.rooms.forEach(room => {
        Object.entries(room.trades).forEach(([tid, tasks]) => {
            tasks.filter(t => t.certPhotoId).forEach(t => {
                certTasks.push({ task: t, room, trade: TRADES[tid] });
            });
        });
    });

    const CERT_LABELS = { pending:'⏳ Pendiente', approved:'✅ Aprobado', revision:'⚠️ Revisión' };
    const CERT_CLS    = { pending:'cert-pending', approved:'cert-approved', revision:'cert-revision' };

    const certGrid = certTasks.length === 0
        ? `<div class="empty-state" style="padding:30px 0">
               <div style="font-size:40px;margin-bottom:12px">🏅</div>
               <h2>Sin certificaciones todavía</h2>
               <p>Marca trabajos como completados y añade fotos de certificación usando el botón 📋 en cada tarea.</p>
           </div>`
        : `<div class="photo-grid">${certTasks.map(({task,room,trade}) => {
            const src  = getPhoto(task.certPhotoId);
            const date = task.certDate ? new Date(task.certDate).toLocaleDateString('es-ES') : '';
            return src ? `<div class="photo-card">
                <img src="${src}" onclick="openLightbox('${src}')" title="Ver foto">
                <div class="photo-card-body">
                    <div style="font-size:12px;font-weight:600;margin-bottom:3px">${esc(task.text)}</div>
                    <div style="font-size:11px;color:var(--text-light);margin-bottom:4px">${trade?.icon||''} ${trade?.name||''} · ${esc(room.name)}</div>
                    <span class="cert-status-badge ${CERT_CLS[task.certStatus]||'cert-pending'}" style="font-size:10px">
                        ${CERT_LABELS[task.certStatus]||'⏳ Pendiente'}
                    </span>
                    ${task.certComment ? `<div style="font-size:11px;color:#888;margin-top:4px;font-style:italic">${esc(task.certComment)}</div>` : ''}
                    <div style="font-size:10px;color:#ccc;margin-top:3px">${date}</div>
                </div>
            </div>` : '';
        }).join('')}</div>`;

    return `
        <div class="dash-header">
            <div><div class="page-title">Fotos</div><div class="page-sub">Registro fotográfico antes y durante la obra.</div></div>
        </div>
        ${tabs}
        ${certGrid}`;
}

// ================================================================
// RENDER — COMPANIES PANEL
// ================================================================

function renderCompaniesPanel() {
    const cards = state.companies.length === 0
        ? `<div class="empty-state">
               <div class="empty-icon">🏢</div>
               <h2>Sin empresas registradas</h2>
               <p>Añade las empresas y autónomos que trabajan en la obra para asignarlas a cada oficio.</p>
               <button class="add-room-btn" onclick="openCompanyModal()">＋ Añadir empresa</button>
           </div>`
        : `<div class="card-grid">${state.companies.map(c => {
            const tradeTags = (c.trades||[]).map(tid => {
                const tr = TRADES[tid];
                return tr ? `<span class="trade-tag" style="background:${tr.color}22;color:${tr.color}">${tr.icon} ${tr.name}</span>` : '';
            }).join('');
            const assignedTo = Object.entries(state.tradeInfo)
                .filter(([,info]) => info.companyId === c.id)
                .map(([tid]) => TRADES[tid]?.name).filter(Boolean);
            return `
                <div class="company-card" onclick="openCompanyModal('${c.id}')">
                    <div class="company-card-top">
                        <div class="company-avatar">🏢</div>
                        <div style="flex:1;min-width:0">
                            <div class="company-name">${esc(c.name)}</div>
                            <div class="company-meta">
                                ${c.phone   ? `📞 ${esc(c.phone)}<br>` : ''}
                                ${c.email   ? `✉️ ${esc(c.email)}<br>` : ''}
                                ${c.cif     ? `🪪 ${esc(c.cif)}`       : ''}
                            </div>
                        </div>
                    </div>
                    ${tradeTags ? `<div style="margin-bottom:8px">${tradeTags}</div>` : ''}
                    ${assignedTo.length ? `<div style="font-size:11px;color:var(--text-light)">Asignada a: ${assignedTo.join(', ')}</div>` : ''}
                    ${c.notes ? `<div style="font-size:12px;color:var(--text-light);margin-top:6px;font-style:italic">${esc(c.notes)}</div>` : ''}
                </div>`;
        }).join('')}</div>`;

    return `
        <div class="dash-header">
            <div><div class="page-title">Empresas</div><div class="page-sub">Directorio de empresas y autónomos · ${state.companies.length} registrada${state.companies.length!==1?'s':''}.</div></div>
            <button class="add-room-btn" onclick="openCompanyModal()">＋ Nueva empresa</button>
        </div>
        ${cards}`;
}

// ================================================================
// RENDER — NOTES PANEL
// ================================================================

const NOTE_CATS = {
    df:      { label:'Dirección Facultativa', cls:'note-cat-df'      },
    gestora: { label:'Empresa Gestora',       cls:'note-cat-gestora' },
    general: { label:'General',               cls:'note-cat-general' },
};

function renderNotesPanel() {
    const notesList = state.projectNotes.length === 0
        ? `<div class="empty-state" style="padding:30px 0">
               <div style="font-size:40px;margin-bottom:12px">📝</div>
               <h2>Sin notas todavía</h2>
               <p>Añade notas de seguimiento, actas o instrucciones para la dirección facultativa o la empresa gestora.</p>
           </div>`
        : state.projectNotes.map(n => {
            const cat  = NOTE_CATS[n.category] || NOTE_CATS.general;
            const date = new Date(n.date).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
            return `
                <div class="note-entry">
                    <span class="note-cat-badge ${cat.cls}">${cat.label}</span>
                    <div class="note-body">
                        <div class="note-date">${date}</div>
                        <div class="note-text">${esc(n.text)}</div>
                    </div>
                    <button class="note-del-btn" title="Eliminar nota" onclick="deleteNote('${n.id}')">✕</button>
                </div>`;
        }).join('');

    return `
        <div class="dash-header">
            <div><div class="page-title">Notas internas</div><div class="page-sub">Seguimiento para dirección facultativa y empresa gestora.</div></div>
        </div>
        <div class="note-add-box">
            <div class="section-label">Nueva nota</div>
            <div class="note-controls">
                <select class="note-cat-sel" id="noteCatSel">
                    <option value="df">Dirección Facultativa</option>
                    <option value="gestora">Empresa Gestora</option>
                    <option value="general" selected>General</option>
                </select>
                <span style="font-size:12px;color:var(--text-light)">Ctrl+Enter para guardar</span>
            </div>
            <div class="note-add-row">
                <textarea class="note-textarea" id="noteTextarea"
                    placeholder="Escribe una nota, acta, incidencia o instrucción…"
                    onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))addNote()"></textarea>
                <button class="btn btn-primary" onclick="addNote()" style="flex-shrink:0">Añadir</button>
            </div>
        </div>
        ${notesList}`;
}

// ================================================================
// FULL RENDER
// ================================================================

function renderContent() {
    switch(state.view) {
        case 'dashboard':  return renderDashboard();
        case 'room':       return renderRoomDetail(state.currentRoom);
        case 'trades':     return renderTradesList();
        case 'trade':      return renderTradeDetail(state.currentTrade);
        case 'materials':  return renderMaterialsPanel();
        case 'companies':  return renderCompaniesPanel();
        case 'notes':      return renderNotesPanel();
        case 'photos':     return renderPhotosPanel();
        default:           return renderDashboard();
    }
}

function renderAll() {
    const contentEl = document.getElementById('content');
    const scrollY   = contentEl ? contentEl.scrollTop : 0;
    const op        = overallProgress();
    const inEst     = state.view === 'dashboard'  || state.view === 'room';
    const inOfi     = state.view === 'trades'     || state.view === 'trade';
    const inMat     = state.view === 'materials';
    const inFot     = state.view === 'photos';
    const inEmp     = state.view === 'companies';
    const inNot     = state.view === 'notes';

    document.getElementById('app').innerHTML = `
        <div class="header">
            <span style="font-size:20px;flex-shrink:0">🏗️</span>
            <h1>Gestión de Obra</h1>
            <div class="header-tabs">
                <button class="header-tab ${inEst?'active':''}" onclick="navigate('dashboard')">🏠 Estancias</button>
                <button class="header-tab ${inOfi?'active':''}" onclick="navigate('trades')">👷 Oficios</button>
                <button class="header-tab ${inMat?'active':''}" onclick="navigate('materials')">📦 Materiales</button>
                <button class="header-tab ${inFot?'active':''}" onclick="navigate('photos')">📷 Fotos</button>
                <button class="header-tab ${inEmp?'active':''}" onclick="navigate('companies')">🏢 Empresas</button>
                <button class="header-tab ${inNot?'active':''}" onclick="navigate('notes')">📝 Notas</button>
            </div>
            <div class="header-progress">
                <span>${op.done}/${op.total}</span>
                <div class="hpbar"><div class="hpbar-fill" style="width:${op.pct}%"></div></div>
                <span class="hpct">${op.pct}%</span>
            </div>
        </div>
        <div class="main">
            <div class="sidebar">${renderSidebar()}</div>
            <div class="content" id="content">${renderContent()}</div>
        </div>`;

    const newContent = document.getElementById('content');
    if (newContent && scrollY) newContent.scrollTop = scrollY;
}

// ================================================================
// BOOT
// ================================================================

initState();
renderAll();
</script>
</body>
</html>
